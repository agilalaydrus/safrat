services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safrat
      POSTGRES_USER: safrat
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safrat -d safrat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
