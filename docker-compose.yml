services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safrat
      POSTGRES_USER: safrat
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safrat -d safrat"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: safrat-local
      MINIO_ROOT_PASSWORD: safrat-local-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3131,http://127.0.0.1:3131
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 safrat-local safrat-local-secret; do sleep 2; done &&
        mc mb --ignore-existing local/safrat-uploads &&
        mc anonymous set download local/safrat-uploads

volumes:
  postgres_data:
  redis_data:
  minio_data:
