syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

service PilgrimService {
  rpc CreatePilgrim(CreatePilgrimRequest) returns (Pilgrim);
  rpc ListPilgrims(ListPilgrimsRequest) returns (ListPilgrimsResponse);
  rpc GetPilgrim(GetPilgrimRequest) returns (Pilgrim);
  rpc UpdatePilgrim(UpdatePilgrimRequest) returns (Pilgrim);
  rpc MarkSubstituted(MarkSubstitutedRequest) returns (Pilgrim);
  rpc RegenerateAccessCode(RegenerateAccessCodeRequest) returns (Pilgrim);
  rpc SubstitutePilgrim(SubstitutePilgrimRequest) returns (SubstitutePilgrimResult);
  rpc GetPilgrimStats(GetPilgrimStatsRequest) returns (PilgrimStats);
  rpc UpdatePilgrimPayment(UpdatePilgrimPaymentRequest) returns (Pilgrim);
  rpc UpdatePilgrimDocuments(UpdatePilgrimDocumentsRequest) returns (Pilgrim);
  rpc UpdatePilgrimEmergencyContact(UpdatePilgrimEmergencyContactRequest) returns (Pilgrim);
  rpc CheckInPilgrimHotel(CheckInPilgrimHotelRequest) returns (Pilgrim);
  rpc ListPilgrimsWithExpiringPassports(ListPilgrimsWithExpiringPassportsRequest) returns (ListPilgrimsResponse);
  rpc ListPilgrimDocuments(ListPilgrimDocumentsRequest) returns (ListPilgrimDocumentsResponse);
  rpc DeletePilgrimDocument(DeletePilgrimDocumentRequest) returns (DeletePilgrimDocumentResponse);
  rpc ListSubstitutions(ListSubstitutionsRequest) returns (ListSubstitutionsResponse);
  rpc ListSeasonDocuments(ListSeasonDocumentsRequest) returns (ListSeasonDocumentsResponse);
}

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
}

message Pilgrim {
  string id = 1;
  string season_id = 2;
  string operator_id = 3;
  string group_id = 4;
  string full_name = 5;
  string passport_number = 6;
  string nationality = 7;
  google.protobuf.Timestamp date_of_birth = 8;
  Gender gender = 9;
  string photo_url = 10;
  string phone = 11;
  string emergency_contact = 12;
  string preferred_lang = 13;
  string medical_notes = 14;
  bool requires_wheelchair = 15;
  string mahram_id = 16;
  bool is_substituted = 17;
  string substituted_by_id = 18;
  string app_access_code = 19;
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
  string kloter_id = 22;
  // Matched against a Better Auth session's email to auto-set
  // linked_user_id (see lib/auth.ts) — lets a pilgrim sign up/in at the
  // same shared /sign-in as admin/leader, no app_access_code link needed.
  string email = 23;
  // True once this pilgrim's email has been matched to a real Better Auth
  // sign-up/sign-in (pilgrims.linked_user_id set) — lets the admin dashboard
  // confirm the pilgrim has actually claimed access, not just that an email
  // was entered for them.
  bool has_account = 24;
  string payment_status = 25; // UNPAID | DP | PAID
  string payment_receipt_url = 26;
  string payment_notes = 27;
  string emergency_contact_name = 28;
  string emergency_contact_phone = 29;
  google.protobuf.Timestamp passport_expiry_date = 30;
  google.protobuf.Timestamp vaccine_meningitis_date = 31;
  bool hotel_checked_in = 32;
  bool documents_passport = 33;
  bool documents_photo = 34;
  bool documents_vaccine = 35;
}

message CreatePilgrimRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
  string group_id = 2;
  string full_name = 3 [(buf.validate.field).string = {min_len: 2, max_len: 100}];
  string passport_number = 4 [(buf.validate.field).string = {min_len: 5, max_len: 20}];
  string nationality = 5 [(buf.validate.field).string.len = 2];
  google.protobuf.Timestamp date_of_birth = 6 [(buf.validate.field).required = true];
  Gender gender = 7 [(buf.validate.field).enum = {defined_only: true, in: [1, 2]}];
  string photo_url = 8;
  string phone = 9;
  string emergency_contact = 10;
  string preferred_lang = 11;
  string medical_notes = 12;
  bool requires_wheelchair = 13;
  string mahram_id = 14;
  string kloter_id = 15;
  string email = 16;
}

message ListPilgrimsRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2;
  int32 offset = 3;
}

message ListPilgrimsResponse {
  repeated Pilgrim pilgrims = 1;
  int64 total_count = 2;
}

message GetPilgrimRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
}

message UpdatePilgrimRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
  string group_id = 2;
  string full_name = 3 [(buf.validate.field).string = {min_len: 2, max_len: 100}];
  string passport_number = 4 [(buf.validate.field).string = {min_len: 5, max_len: 20}];
  string nationality = 5 [(buf.validate.field).string.len = 2];
  google.protobuf.Timestamp date_of_birth = 6 [(buf.validate.field).required = true];
  Gender gender = 7 [(buf.validate.field).enum = {defined_only: true, in: [1, 2]}];
  string photo_url = 8;
  string phone = 9;
  string emergency_contact = 10;
  string preferred_lang = 11;
  string medical_notes = 12;
  bool requires_wheelchair = 13;
  string mahram_id = 14;
  string kloter_id = 15;
  string email = 16;
}

message MarkSubstitutedRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
}

message RegenerateAccessCodeRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
}

message SubstitutePilgrimRequest {
  string original_pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
  string replacement_pilgrim_id = 2 [(buf.validate.field).string.uuid = true];
  string reason = 3 [(buf.validate.field).string.max_len = 500];
}

message SubstitutePilgrimResult {
  Pilgrim original = 1;
  Pilgrim replacement = 2;
}

message Substitution {
  string original_id = 1;
  string original_name = 2;
  string original_passport_number = 3;
  string new_id = 4;
  string new_name = 5;
  string reason = 6;
  google.protobuf.Timestamp substituted_at = 7;
}

message ListSubstitutionsRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListSubstitutionsResponse {
  repeated Substitution substitutions = 1;
}

message GetPilgrimStatsRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
  // Optional — scopes the stats to one kloter instead of the whole season.
  string kloter_id = 2;
}

message PilgrimStats {
  int32 total = 1;
  int32 substituted = 2;
  int32 requires_wheelchair = 3;
  int32 unassigned_group = 4;
  int32 unassigned_kloter = 5;
}

message UpdatePilgrimPaymentRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
  string payment_status = 2 [(buf.validate.field).string = {in: ["UNPAID", "DP", "PAID"]}];
  string payment_receipt_url = 3;
  string payment_notes = 4 [(buf.validate.field).string.max_len = 1000];
}

message UpdatePilgrimDocumentsRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
  bool documents_passport = 2;
  bool documents_photo = 3;
  bool documents_vaccine = 4;
  google.protobuf.Timestamp passport_expiry_date = 5;
  google.protobuf.Timestamp vaccine_meningitis_date = 6;
}

message UpdatePilgrimEmergencyContactRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
  string emergency_contact_name = 2 [(buf.validate.field).string.max_len = 100];
  string emergency_contact_phone = 3 [(buf.validate.field).string.max_len = 30];
}

message CheckInPilgrimHotelRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
  bool checked_in = 2;
}

message ListPilgrimsWithExpiringPassportsRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
  // Days threshold, e.g. 180 means "expiring within 180 days".
  int32 days_threshold = 2 [(buf.validate.field).int32 = {gt: 0, lte: 3650}];
}

message PilgrimDocument {
  string id = 1;
  string pilgrim_id = 2;
  string doc_type = 3;
  string file_url = 4;
  string file_name = 5;
  string uploaded_by = 6;
  google.protobuf.Timestamp created_at = 7;
  // Only populated by ListSeasonDocuments — a season-wide listing needs to
  // show whose document this is; a per-pilgrim listing already has that
  // context from the page it's rendered on, so these stay empty there.
  string pilgrim_name = 8;
  string passport_number = 9;
}

message ListPilgrimDocumentsRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListPilgrimDocumentsResponse {
  repeated PilgrimDocument documents = 1;
}

message ListSeasonDocumentsRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListSeasonDocumentsResponse {
  repeated PilgrimDocument documents = 1;
}

message DeletePilgrimDocumentRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeletePilgrimDocumentResponse {}
