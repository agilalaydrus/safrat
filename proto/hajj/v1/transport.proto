syntax = "proto3";
package hajj.v1;
option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
// mode is one of BUS, FLIGHT, TRAIN — changes what "vehicle" means (plate/driver
// vs flight number/airline vs train number/operator) but not the Vehicle schema itself.
message Movement { string id=1; string operator_id=2; string season_id=3; string name=4; string origin=5; string destination=6; google.protobuf.Timestamp scheduled_at=7; string status=8; int32 vehicle_count=9; int32 total_capacity=10; int32 assigned_count=11; google.protobuf.Timestamp created_at=12; string mode=13; }
message Vehicle { string id=1; string movement_id=2; string operator_id=3; string plate_number=4; int32 capacity=5; string driver_name=6; string driver_phone=7; string status=8; int32 assigned_count=9; google.protobuf.Timestamp departed_at=10; google.protobuf.Timestamp arrived_at=11; google.protobuf.Timestamp created_at=12; }
message PilgrimOnVehicle { string id=1; string full_name=2; string gender=3; string passport_number=4; bool requires_wheelchair=5; int32 seat_number=6; }
message VehicleManifest { Vehicle vehicle=1; repeated PilgrimOnVehicle pilgrims=2; }
message SeatAssignment { string id=1; string vehicle_id=2; string pilgrim_id=3; int32 seat_number=4; google.protobuf.Timestamp assigned_at=5; }
message CreateMovementRequest { string season_id=1; string name=2; string origin=3; string destination=4; google.protobuf.Timestamp scheduled_at=5; string mode=6; }
message GetMovementRequest { string movement_id=1; } message ListMovementsRequest { string season_id=1; } message ListMovementsResponse { repeated Movement movements=1; }
message UpdateMovementStatusRequest { string movement_id=1; string status=2; } message DeleteMovementRequest { string movement_id=1; }
message CreateVehicleRequest { string movement_id=1; string plate_number=2; int32 capacity=3; string driver_name=4; string driver_phone=5; }
message ListVehiclesRequest { string movement_id=1; } message ListVehiclesResponse { repeated Vehicle vehicles=1; }
message UpdateVehicleStatusRequest { string vehicle_id=1; string status=2; } message DeleteVehicleRequest { string vehicle_id=1; }
message AssignSeatRequest { string vehicle_id=1; string pilgrim_id=2; int32 seat_number=3; } message UnassignSeatRequest { string vehicle_id=1; string pilgrim_id=2; } message GetVehicleManifestRequest { string vehicle_id=1; }
service TransportService { rpc CreateMovement(CreateMovementRequest) returns (Movement); rpc GetMovement(GetMovementRequest) returns (Movement); rpc ListMovements(ListMovementsRequest) returns (ListMovementsResponse); rpc UpdateMovementStatus(UpdateMovementStatusRequest) returns (Movement); rpc DeleteMovement(DeleteMovementRequest) returns (google.protobuf.Empty); rpc CreateVehicle(CreateVehicleRequest) returns (Vehicle); rpc ListVehicles(ListVehiclesRequest) returns (ListVehiclesResponse); rpc UpdateVehicleStatus(UpdateVehicleStatusRequest) returns (Vehicle); rpc DeleteVehicle(DeleteVehicleRequest) returns (google.protobuf.Empty); rpc AssignSeat(AssignSeatRequest) returns (SeatAssignment); rpc UnassignSeat(UnassignSeatRequest) returns (google.protobuf.Empty); rpc GetVehicleManifest(GetVehicleManifestRequest) returns (VehicleManifest); }
