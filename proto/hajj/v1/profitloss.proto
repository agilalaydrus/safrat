syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

// ProfitLossService is the operator-wide P&L (§2.16 RENCANA): revenue, cost
// of goods, gross/net profit, per-unit profit, and where it came from — by
// branch and by referring agent — over the last few months. Time-based, not
// season-scoped, like any other financial statement: a season boundary does
// not mean anything to an accountant reading last month's numbers.
service ProfitLossService {
  // GetProfitLossReport computes everything on read from orders, products
  // and branches — nothing is stored or cached, so it can never disagree
  // with the ledger it is read from.
  rpc GetProfitLossReport(GetProfitLossReportRequest) returns (GetProfitLossReportResponse);

  // StreamProfitLossExport is the row-level export behind the summary —
  // streamed from the first row, not built into one response in memory,
  // because a non-streaming export is exactly what took a competitor's PDF
  // worker down at 1,240 pilgrims (see the task file).
  rpc StreamProfitLossExport(StreamProfitLossExportRequest) returns (stream ProfitLossExportRow);
}

message GetProfitLossReportRequest {
  // How many trailing calendar months to report, this one included.
  // Defaults to 5 when unset.
  int32 months = 1 [(buf.validate.field).int32 = {gte: 0, lte: 24}];
}

// PeriodFigure is one calendar month's totals. cost_idr is the sum of
// quantity * product.supplier_cost_idr over PAID orders whose product has a
// known cost — orders_missing_cost / revenue_missing_cost_idr say how much
// of this month's revenue is NOT reflected in cost_idr, so the gross figures
// are never read as more complete than they are.
message PeriodFigure {
  string period_label = 1; // "September 2026"
  google.protobuf.Timestamp period_start = 2;
  int64 revenue_idr = 3;
  int64 cost_idr = 4;
  int64 gross_profit_idr = 5;
  double gross_margin_pct = 6;
  // Revenue minus cost minus platform fee minus agent commission — what the
  // operator actually keeps.
  int64 net_profit_idr = 7;
  int32 unit_count = 8;
  int64 net_profit_per_unit_idr = 9;
  int32 orders_missing_cost = 10;
  int64 revenue_missing_cost_idr = 11;
}

message BranchFigure {
  string branch_id = 1;
  string branch_name = 2;
  int64 revenue_idr = 3;
  int64 net_profit_idr = 4;
  int64 target_revenue_idr = 5; // 0 = no target set
  double target_achieved_pct = 6; // 0 when target_revenue_idr is 0
  // Share of the window's total net profit, across every branch and every
  // order with no branch at all (head office).
  double net_profit_contribution_pct = 7;
}

message AgentFigure {
  string agent_id = 1;
  string agent_name = 2;
  int64 revenue_idr = 3;
  int64 commission_idr = 4;
  int32 order_count = 5;
}

message GetProfitLossReportResponse {
  repeated PeriodFigure periods = 1;
  repeated BranchFigure branches = 2;
  repeated AgentFigure agents = 3;
  // Totals across every period in the window — periods[] already sums to
  // this, kept separately so a screen doesn't have to re-derive it.
  PeriodFigure window_total = 4;
}

message StreamProfitLossExportRequest {
  int32 months = 1 [(buf.validate.field).int32 = {gte: 0, lte: 24}];
}

message ProfitLossExportRow {
  string order_id = 1;
  google.protobuf.Timestamp paid_at = 2;
  string pilgrim_name = 3;
  string product_name = 4;
  string branch_name = 5;
  string agent_name = 6;
  int32 quantity = 7;
  int64 revenue_idr = 8;
  // Empty (cost_known = false) when the product has no supplier_cost_idr —
  // never silently treated as zero.
  bool cost_known = 9;
  int64 cost_idr = 10;
  int64 platform_amount_idr = 11;
  int64 agent_commission_idr = 12;
  int64 net_profit_idr = 13; // 0 when cost_known is false
}
