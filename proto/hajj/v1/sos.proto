syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

service SOSService {
  // CreateSOSAlert is public (app_access_code) — see publicProcedures in
  // internal/middleware/auth.go. Deliberately NOT rate-limited: throttling a
  // safety feature is the wrong failure mode. See ratelimit.go.
  rpc CreateSOSAlert(CreateSOSAlertRequest) returns (SOSAlert);

  // Authenticated — the coordinator dashboard.
  rpc ListActiveSOSAlerts(ListActiveSOSAlertsRequest) returns (ListSOSAlertsResponse);
  rpc AcknowledgeSOSAlert(AcknowledgeSOSAlertRequest) returns (SOSAlert);
  rpc ResolveSOSAlert(ResolveSOSAlertRequest) returns (SOSAlert);
}

message SOSAlert {
  string id = 1;
  string pilgrim_id = 2;
  string pilgrim_name = 3;
  string status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp acknowledged_at = 6;
  google.protobuf.Timestamp resolved_at = 7;
  string notes = 8;
  // Location at the moment the alert was raised, if a GPS fix was available
  // (either a fresh one from the pilgrim's device, or their last periodic
  // ping — see PilgrimAppService.UpdateMyLocation). has_location is false
  // when neither was ever available.
  double lat = 9;
  double lng = 10;
  bool has_location = 11;
  google.protobuf.Timestamp location_at = 12;
}

message CreateSOSAlertRequest {
  string app_access_code = 1 [(buf.validate.field).string.min_len = 1];
  // Optional — a fresh one-shot GPS fix taken right before sending. Falls
  // back to the pilgrim's last periodic location ping when omitted/unavailable.
  optional double lat = 2 [(buf.validate.field).double = {gte: -90, lte: 90}];
  optional double lng = 3 [(buf.validate.field).double = {gte: -180, lte: 180}];
}

message ListActiveSOSAlertsRequest {}
message ListSOSAlertsResponse { repeated SOSAlert alerts = 1; }

message AcknowledgeSOSAlertRequest {
  string sos_alert_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ResolveSOSAlertRequest {
  string sos_alert_id = 1 [(buf.validate.field).string.min_len = 1];
  string notes = 2;
}
