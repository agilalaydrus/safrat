syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

// BranchService manages an operator's branch offices. Authorization and
// branch visibility are enforced below the handler: a branch head must never
// be able to widen these requests to another branch.
service BranchService {
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  rpc CreateBranch(CreateBranchRequest) returns (Branch);
  rpc UpdateBranch(UpdateBranchRequest) returns (Branch);
  rpc AssignBranchHead(AssignBranchHeadRequest) returns (Branch);
  rpc GetBranchPerformance(GetBranchPerformanceRequest) returns (GetBranchPerformanceResponse);
}

message Branch {
  string id = 1;
  string operator_id = 2;
  string name = 3;
  string city = 4;
  int32 target_pilgrims = 5;
  int64 target_revenue_idr = 6;
  string head_user_id = 7;
  string head_name = 8;
  string head_email = 9;
  string phone = 10;
  string bank_name = 11;
  string account_number = 12;
  string account_holder = 13;
  bool is_active = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

message ListBranchesRequest {
  bool include_inactive = 1;
}

message ListBranchesResponse {
  repeated Branch branches = 1;
}

message CreateBranchRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 120}];
  string city = 2 [(buf.validate.field).string.max_len = 120];
  int32 target_pilgrims = 3 [(buf.validate.field).int32.gte = 0];
  int64 target_revenue_idr = 4 [(buf.validate.field).int64.gte = 0];
  string phone = 5 [(buf.validate.field).string.max_len = 40];
  string bank_name = 6 [(buf.validate.field).string.max_len = 120];
  string account_number = 7 [(buf.validate.field).string.max_len = 80];
  string account_holder = 8 [(buf.validate.field).string.max_len = 120];
}

message UpdateBranchRequest {
  string branch_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 120}];
  string city = 3 [(buf.validate.field).string.max_len = 120];
  int32 target_pilgrims = 4 [(buf.validate.field).int32.gte = 0];
  int64 target_revenue_idr = 5 [(buf.validate.field).int64.gte = 0];
  string phone = 6 [(buf.validate.field).string.max_len = 40];
  string bank_name = 7 [(buf.validate.field).string.max_len = 120];
  string account_number = 8 [(buf.validate.field).string.max_len = 80];
  string account_holder = 9 [(buf.validate.field).string.max_len = 120];
  bool is_active = 10;
}

message AssignBranchHeadRequest {
  string branch_id = 1 [(buf.validate.field).string.uuid = true];
  // Empty clears the current head. A non-empty value is a Better Auth user ID
  // and must belong to the same operator as the branch.
  string user_id = 2 [(buf.validate.field).string.max_len = 255];
}

message GetBranchPerformanceRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetBranchPerformanceResponse {
  repeated BranchPerformance branches = 1;
  int64 network_revenue_idr = 2;
  int32 network_pilgrim_count = 3;
  int32 below_target_count = 4;
}

message BranchPerformance {
  Branch branch = 1;
  int64 revenue_idr = 2;
  int32 pilgrim_count = 3;
  int32 agent_count = 4;
  double revenue_achievement_pct = 5;
  double pilgrim_achievement_pct = 6;
  // Ranking score: 70% revenue achievement and 30% pilgrim achievement.
  double score = 7;
  double collection_pct = 8;
  double documents_ready_pct = 9;
  repeated BranchTrendPoint trend = 10;
}

message BranchTrendPoint {
  // Calendar month formatted as YYYY-MM.
  string month = 1;
  int64 revenue_idr = 2;
  int32 pilgrim_count = 3;
}
