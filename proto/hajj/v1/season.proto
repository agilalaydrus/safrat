syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

service SeasonService {
  rpc CreateSeason(CreateSeasonRequest) returns (Season);
  rpc ListSeasons(ListSeasonsRequest) returns (ListSeasonsResponse);
  rpc UpdateSeason(UpdateSeasonRequest) returns (Season);
  // DeleteSeason refuses if the season has any pilgrims, groups, kloters,
  // hotels, movements, products, or orders — every one of those cascades
  // on the season FK, so an unguarded delete would silently wipe a
  // season's whole operational history. See SeasonService.Delete.
  rpc DeleteSeason(DeleteSeasonRequest) returns (DeleteSeasonResponse);
  rpc SetActiveSeason(SetActiveSeasonRequest) returns (Season);
  rpc GetSeasonAnalytics(GetSeasonAnalyticsRequest) returns (SeasonAnalytics);
}

// Musim dijual per periode kalender Hijriah, bukan cuma Haji/Umrah datar —
// Rajab, Ramadhan, Syawal, dan Dzulqa'dah masing-masing demand dan harganya
// beda. Sub-periode yang lebih halus (mis. "Ramadhan 10 hari terakhir")
// dibedakan lewat nama musim + start_date/end_date, bukan nilai enum lagi.
enum SeasonType {
  SEASON_TYPE_UNSPECIFIED = 0;
  SEASON_TYPE_HAJJ = 1;
  SEASON_TYPE_UMRAH_REGULER = 2;
  SEASON_TYPE_UMRAH_RAJAB = 3;
  SEASON_TYPE_UMRAH_RAMADHAN = 4;
  SEASON_TYPE_UMRAH_SYAWAL = 5;
  SEASON_TYPE_UMRAH_DZULQAIDAH = 6;
}

message Season {
  string id = 1;
  string operator_id = 2;
  string name = 3;
  SeasonType type = 4;
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp end_date = 6;
  bool is_active = 7;
  google.protobuf.Timestamp created_at = 8;
  // Maximum pilgrims accepted. 0 = unlimited — JoinWaitlist always
  // redirects to registration instead of queuing when this is 0.
  int32 capacity = 9;
}

message CreateSeasonRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  SeasonType type = 2 [(buf.validate.field).enum = {defined_only: true, in: [1, 2, 3, 4, 5, 6]}];
  google.protobuf.Timestamp start_date = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp end_date = 4 [(buf.validate.field).required = true];
  int32 capacity = 5 [(buf.validate.field).int32.gte = 0];
}

message ListSeasonsRequest {}

message ListSeasonsResponse { repeated Season seasons = 1; }

message UpdateSeasonRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  SeasonType type = 3 [(buf.validate.field).enum = {defined_only: true, in: [1, 2, 3, 4, 5, 6]}];
  google.protobuf.Timestamp start_date = 4 [(buf.validate.field).required = true];
  google.protobuf.Timestamp end_date = 5 [(buf.validate.field).required = true];
  int32 capacity = 6 [(buf.validate.field).int32.gte = 0];
}

message DeleteSeasonRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteSeasonResponse {}

message SetActiveSeasonRequest {
  string season_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetSeasonAnalyticsRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
}

message SeasonAnalytics {
  int64 total_pilgrims = 1;
  int64 paid_count = 2;
  int64 dp_count = 3;
  int64 unpaid_count = 4;
  int64 docs_complete = 5;
  int64 checked_in_count = 6;
  int64 rooms_allocated = 7;
  int64 seats_assigned = 8;
}
