syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

// KloterService manages kloter — the Kemenag-level departure batch (one
// flight, one departure date) Indonesian Hajj/Umrah operators schedule
// around. Distinct from GroupService's "rombongan": a kloter typically
// contains several rombongan.
service KloterService {
  rpc ListKloters(ListKlotersRequest) returns (ListKlotersResponse);
  rpc CreateKloter(CreateKloterRequest) returns (Kloter);
  rpc UpdateKloter(UpdateKloterRequest) returns (Kloter);
  rpc DeleteKloter(DeleteKloterRequest) returns (google.protobuf.Empty);
  // UpdateKloterStatus moves a kloter through its lifecycle stepper
  // (DRAFT -> CONFIRMED -> DEPARTED -> IN_SAUDI -> DEPARTED_SAUDI ->
  // COMPLETED). Forward-only except the explicit CONFIRMED -> DRAFT
  // rollback. Triggers a bulk pilgrim_journey_status cascade for every
  // pilgrim in the kloter (best-effort, never rolls back this call).
  rpc UpdateKloterStatus(UpdateKloterStatusRequest) returns (Kloter);

  // GetKloterManifest is the list that leaves the office: every pilgrim on the
  // flight, with the documents each one is still missing. It exists because
  // "who is not ready" is asked constantly and answering it by opening two
  // hundred pilgrim records is how departures slip.
  rpc GetKloterManifest(GetKloterManifestRequest) returns (GetKloterManifestResponse);
}

message GetKloterManifestRequest {
  string kloter_id = 1 [(buf.validate.field).string.min_len = 1];
}

// One line of the manifest.
message ManifestRow {
  string pilgrim_id = 1;
  string full_name = 2;
  string passport_number = 3;
  string gender = 4;
  google.protobuf.Timestamp date_of_birth = 5;
  string group_name = 6;
  string room_label = 7;
  string phone = 8;
  // The six documents an Indonesian umrah departure needs. Booleans rather
  // than a count, because "which one is missing" is the actionable half.
  bool has_passport = 9;
  bool has_vaccine = 10;
  bool has_photo = 11;
  bool has_ktp = 12;
  bool has_kk = 13;
  bool has_mahram_proof = 14;
  // Proof of marriage or kinship is only required of somebody travelling under
  // a mahram. Demanding it of every pilgrim would mark most of a manifest
  // incomplete for a document they are not asked for.
  bool mahram_proof_required = 15;
  bool documents_complete = 16;
  // Named, in order, so a screen can say what to chase rather than only that
  // something is missing.
  repeated string missing_documents = 17;
}

message GetKloterManifestResponse {
  string kloter_id = 1;
  string kloter_code = 2;
  string flight_number = 3;
  string embarkation = 4;
  google.protobuf.Timestamp departure_date = 5;
  int32 capacity = 6;
  repeated ManifestRow rows = 7;
  int32 ready_count = 8;
  // Counted per document, so the screen can show what is blocking the most
  // people rather than a single unhelpful total.
  map<string, int32> missing_by_document = 9;
}

message Kloter {
  string id = 1;
  string season_id = 2;
  string code = 3;
  string embarkation = 4;
  string flight_number = 5;
  google.protobuf.Timestamp departure_date = 6;
  int32 capacity = 7;
  int32 pilgrim_count = 8;
  string status = 9; // DRAFT | CONFIRMED | DEPARTED | IN_SAUDI | DEPARTED_SAUDI | COMPLETED
  string notes = 10;
}

message ListKlotersRequest {
  string season_id = 1 [(buf.validate.field).string.min_len = 1];
}
message ListKlotersResponse { repeated Kloter kloters = 1; }

message CreateKloterRequest {
  string season_id = 1 [(buf.validate.field).string.min_len = 1];
  string code = 2 [(buf.validate.field).string.min_len = 1];
  string embarkation = 3;
  string flight_number = 4;
  google.protobuf.Timestamp departure_date = 5;
  int32 capacity = 6;
}

message UpdateKloterRequest {
  string kloter_id = 1 [(buf.validate.field).string.min_len = 1];
  string code = 2 [(buf.validate.field).string.min_len = 1];
  string embarkation = 3;
  string flight_number = 4;
  google.protobuf.Timestamp departure_date = 5;
  int32 capacity = 6;
}

message DeleteKloterRequest {
  string kloter_id = 1 [(buf.validate.field).string.min_len = 1];
}

message UpdateKloterStatusRequest {
  string kloter_id = 1 [(buf.validate.field).string.min_len = 1];
  string status = 2 [(buf.validate.field).string.min_len = 1];
}
