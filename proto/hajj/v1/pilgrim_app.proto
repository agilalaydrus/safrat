syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "hajj/v1/transport.proto";
import "hajj/v1/product.proto";
import "hajj/v1/broadcast.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

// PilgrimAppService is mostly public — most methods authenticate via
// app_access_code instead of a Better Auth session. See publicProcedures in
// internal/middleware/auth.go. LinkGoogleAccount is the one exception: it
// requires a real, server-validated Better Auth session (so a spoofed
// user id in the request body can never link someone else's Google account
// to a pilgrim) but — unlike the admin/leader surface — does NOT require
// organization membership, since a pilgrim's Google identity is never an
// org member. See sessionOnlyProcedures in internal/middleware/auth.go.
service PilgrimAppService {
  rpc GetMyInfo(PilgrimAppRequest) returns (PilgrimAppInfo);
  rpc ListMySchedule(PilgrimAppRequest) returns (ListMyScheduleResponse);
  rpc ListMyProducts(PilgrimAppRequest) returns (ListMyProductsResponse);
  // UpdateMyLocation is called every 5 minutes by the pilgrim PWA (and once
  // more, best-effort, right before an SOS alert is sent) so a coordinator
  // or leader always has a recent GPS fix to work from during an emergency.
  rpc UpdateMyLocation(UpdateMyLocationRequest) returns (UpdateMyLocationResponse);
  // RequestWheelchair lets a pilgrim self-report a wheelchair need directly
  // from the app instead of requiring a coordinator to set it on their behalf.
  rpc RequestWheelchair(RequestWheelchairRequest) returns (RequestWheelchairResponse);
  // LinkGoogleAccount ties the pilgrim record behind app_access_code to
  // whichever Better Auth identity the caller is currently signed in as
  // (via Google). Establishes a verified identity ahead of any future
  // money-touching action (Module 7 orders/payments) — the access-code
  // link alone keeps working for everything that exists today.
  rpc LinkGoogleAccount(LinkGoogleAccountRequest) returns (LinkGoogleAccountResponse);
  // ListMyBroadcasts is public (app_access_code), like the rest of this
  // service — resolves the pilgrim's operator+season from the code, then
  // lists that season's broadcasts. See publicProcedures in auth.go.
  rpc ListMyBroadcasts(PilgrimAppRequest) returns (ListBroadcastsResponse);
}

message PilgrimAppRequest {
  string app_access_code = 1 [(buf.validate.field).string.min_len = 1];
}

message PilgrimAppInfo {
  string id = 1;
  string full_name = 2;
  string passport_number = 3;
  string group_name = 4;
  string hotel_name = 5;
  string room_number = 6;
  bool requires_wheelchair = 7;
  Movement next_movement = 8;
  string kloter_code = 9;
  string kloter_embarkation = 10;
  string kloter_flight_number = 11;
  google.protobuf.Timestamp kloter_departure_date = 12;
  // Empty if this pilgrim has never linked a Google account.
  string linked_google_email = 13;
}

message ListMyScheduleResponse {
  repeated Movement movements = 1;
}

message ListMyProductsResponse {
  repeated Product products = 1;
}

message UpdateMyLocationRequest {
  string app_access_code = 1 [(buf.validate.field).string.min_len = 1];
  double lat = 2 [(buf.validate.field).double = {gte: -90, lte: 90}];
  double lng = 3 [(buf.validate.field).double = {gte: -180, lte: 180}];
}

message UpdateMyLocationResponse {}

message RequestWheelchairRequest {
  string app_access_code = 1 [(buf.validate.field).string.min_len = 1];
  bool requires_wheelchair = 2;
}

message RequestWheelchairResponse {
  bool requires_wheelchair = 1;
}

message LinkGoogleAccountRequest {
  string app_access_code = 1 [(buf.validate.field).string.min_len = 1];
}

message LinkGoogleAccountResponse {
  string linked_google_email = 1;
}
