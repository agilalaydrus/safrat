syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "hajj/v1/transport.proto";
import "hajj/v1/product.proto";
import "hajj/v1/broadcast.proto";
import "hajj/v1/ritual.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

// PilgrimAppService is mostly public — most methods authenticate via
// app_access_code instead of a Better Auth session. See publicProcedures in
// internal/middleware/auth.go. LinkGoogleAccount is the one exception: it
// requires a real, server-validated Better Auth session (so a spoofed
// user id in the request body can never link someone else's Google account
// to a pilgrim) but — unlike the admin/leader surface — does NOT require
// organization membership, since a pilgrim's Google identity is never an
// org member. See sessionOnlyProcedures in internal/middleware/auth.go.
service PilgrimAppService {
  rpc GetMyInfo(GetMyInfoRequest) returns (PilgrimAppInfo);
  rpc ListMySchedule(ListMyScheduleRequest) returns (ListMyScheduleResponse);
  rpc ListMyProducts(ListMyProductsRequest) returns (ListMyProductsResponse);
  // UpdateMyLocation is called every 5 minutes by the pilgrim PWA (and once
  // more, best-effort, right before an SOS alert is sent) so a coordinator
  // or leader always has a recent GPS fix to work from during an emergency.
  rpc UpdateMyLocation(UpdateMyLocationRequest) returns (UpdateMyLocationResponse);
  // RequestWheelchair lets a pilgrim self-report a wheelchair need directly
  // from the app instead of requiring a coordinator to set it on their behalf.
  rpc RequestWheelchair(RequestWheelchairRequest) returns (RequestWheelchairResponse);
  // LinkGoogleAccount ties the pilgrim record behind app_access_code to
  // whichever Better Auth identity the caller is currently signed in as
  // (via Google). Establishes a verified identity ahead of any future
  // money-touching action (Module 7 orders/payments) — the access-code
  // link alone keeps working for everything that exists today.
  rpc LinkGoogleAccount(LinkGoogleAccountRequest) returns (LinkGoogleAccountResponse);
  // ListMyBroadcasts is public (app_access_code), like the rest of this
  // service — resolves the pilgrim's operator+season from the code, then
  // lists that season's broadcasts. See publicProcedures in auth.go.
  rpc ListMyBroadcasts(ListMyBroadcastsRequest) returns (ListBroadcastsResponse);
  // GetMyCertificate is public (app_access_code), same as the rest of
  // this service. Also reachable via /certificate/[code] with no
  // pilgrim session at all — see family_tracker.proto for the same
  // "public, code-authenticated, minimal fields" pattern.
  rpc GetMyCertificate(GetMyCertificateRequest) returns (CertificateData);
  // SubmitMyPilgrimKyc lets a pilgrim fill in their own NIK/address instead
  // of waiting on an admin — public (app_access_code), like the rest of
  // this service. Always lands in PENDING_REVIEW regardless of who
  // submitted it; an admin still has to verify (see
  // PilgrimService.VerifyPilgrimKyc). Never gates any other pilgrim
  // feature today.
  rpc SubmitMyPilgrimKyc(SubmitMyPilgrimKycRequest) returns (PilgrimAppInfo);
  // ListMyRituals is public (app_access_code) — powers the "Ibadah Saya"
  // tab. Read-only; completion is always recorded by a Muttawwif via
  // RitualService, never self-reported.
  rpc ListMyRituals(ListMyRitualsRequest) returns (ListMyRitualsResponse);
  // RegisterMyPushToken is public (app_access_code) — the pilgrim PWA has
  // no guaranteed Better Auth session, so push tokens for pilgrims are
  // keyed to pilgrim_id directly (pilgrim_push_tokens), not to a Better
  // Auth user_id like NotificationService.RegisterPushSubscription.
  rpc RegisterMyPushToken(RegisterMyPushTokenRequest) returns (RegisterMyPushTokenResponse);
}

message ListMyRitualsResponse {
  repeated PilgrimRitualStatus rituals = 1;
}

message RegisterMyPushTokenRequest {
  string app_access_code = 1 [(buf.validate.field).string.min_len = 1];
  string fcm_token = 2 [(buf.validate.field).string.min_len = 1];
}
message RegisterMyPushTokenResponse {}

message GetMyInfoRequest { string app_access_code = 1 [(buf.validate.field).string.min_len = 1]; }
message ListMyScheduleRequest { string app_access_code = 1 [(buf.validate.field).string.min_len = 1]; }
message ListMyProductsRequest { string app_access_code = 1 [(buf.validate.field).string.min_len = 1]; }
message ListMyBroadcastsRequest { string app_access_code = 1 [(buf.validate.field).string.min_len = 1]; }
message GetMyCertificateRequest { string app_access_code = 1 [(buf.validate.field).string.min_len = 1]; }
message ListMyRitualsRequest { string app_access_code = 1 [(buf.validate.field).string.min_len = 1]; }

message PilgrimAppInfo {
  string id = 1;
  string full_name = 2;
  string passport_number = 3;
  string group_name = 4;
  string hotel_name = 5;
  string room_number = 6;
  bool requires_wheelchair = 7;
  Movement next_movement = 8;
  string kloter_code = 9;
  string kloter_embarkation = 10;
  string kloter_flight_number = 11;
  google.protobuf.Timestamp kloter_departure_date = 12;
  // Empty if this pilgrim has never linked a Google account.
  string linked_google_email = 13;
  string phone = 14;
  string nik = 15;
  string address = 16;
  string kyc_status = 17; // UNVERIFIED | PENDING_REVIEW | VERIFIED | REJECTED
  string kyc_rejection_reason = 18;
  string place_of_birth = 19;
  string marital_status = 20;
  string occupation = 21;
  string father_name = 22;
  // ACTIVE | CANCELLED — whether the operator has confirmed/kept this
  // pilgrim's participation, independent of KYC.
  string status = 23;
  string payment_status = 24; // UNPAID | DP | PAID
  // Full list of hotel stays (Makkah + Madinah, when both are assigned) —
  // hotel_name/room_number above are just a "what's current" summary.
  repeated HotelStay hotel_stays = 25;
  // Position in the end-to-end trip lifecycle (REGISTERED..COMPLETED) —
  // see domain.JourneyStatuses. Powers the pilgrim app's "Perjalanan Saya"
  // timeline; updates whenever a Muttawwif/Tour Leader/operator action
  // cascades a journey-status change.
  string journey_status = 26;
}

message HotelStay {
  string hotel_name = 1;
  string room_number = 2;
  string room_type = 3;
}

message ListMyScheduleResponse {
  repeated Movement movements = 1;
}

message ListMyProductsResponse {
  repeated Product products = 1;
}

message UpdateMyLocationRequest {
  string app_access_code = 1 [(buf.validate.field).string.min_len = 1];
  double lat = 2 [(buf.validate.field).double = {gte: -90, lte: 90}];
  double lng = 3 [(buf.validate.field).double = {gte: -180, lte: 180}];
}

message UpdateMyLocationResponse {}

message RequestWheelchairRequest {
  string app_access_code = 1 [(buf.validate.field).string.min_len = 1];
  bool requires_wheelchair = 2;
}

message RequestWheelchairResponse {
  bool requires_wheelchair = 1;
}

message LinkGoogleAccountRequest {
  string app_access_code = 1 [(buf.validate.field).string.min_len = 1];
}

message LinkGoogleAccountResponse {
  string linked_google_email = 1;
}

message SubmitMyPilgrimKycRequest {
  string app_access_code = 1 [(buf.validate.field).string.min_len = 1];
  string nik = 2 [(buf.validate.field).string.max_len = 32];
  string address = 3 [(buf.validate.field).string.max_len = 300];
  string place_of_birth = 4 [(buf.validate.field).string.max_len = 100];
  string marital_status = 5 [(buf.validate.field).string = {in: ["", "SINGLE", "MARRIED", "DIVORCED", "WIDOWED"]}];
  string occupation = 6 [(buf.validate.field).string.max_len = 100];
  string father_name = 7 [(buf.validate.field).string.max_len = 100];
}

message CertificateData {
  string pilgrim_name = 1;
  string passport_number = 2;
  string nationality = 3;
  string season_name = 4;
  string season_type = 5;
  google.protobuf.Timestamp start_date = 6;
  google.protobuf.Timestamp end_date = 7;
  string operator_name = 8;
  string license_number = 9;
  string group_name = 10;
  string leader_name = 11;
  string hotels_visited = 12;
  string makkah_hotels = 13;
  string madinah_hotels = 14;
  // false until journey_status reaches ARRIVED_INDONESIA/COMPLETED — other
  // fields are zero-valued while locked, so the client should check this
  // before rendering anything.
  bool unlocked = 15;
}
