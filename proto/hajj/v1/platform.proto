  // requires it, so the panel needs both answers to tell "you have no access"
  // apart from "you have access but must enrol first".
  bool two_factor_enabled = 2;
}

message PlatformOperator {
  string id = 1;
  string name = 2;
  string slug = 3;
  string plan = 4;
  string subscription_status = 5;
  google.protobuf.Timestamp access_until = 6;
  int32 pilgrim_count = 7;
  int32 product_count = 8;
  // Transactions sitting in HELD across this operator — money that arrived and
  // is waiting on somebody's decision.
  int32 held_order_count = 9;
  google.protobuf.Timestamp created_at = 10;
  // Set only when entry was closed deliberately. Access itself is decided by
  // access_until; this separates "has not paid yet" from "frozen on purpose".
  google.protobuf.Timestamp suspended_at = 11;
  // Furthest dunning stage reached for the current lapse: H1 | H7 | H14 |
  // SUSPEND, empty when nothing has been sent.
  string dunning_stage = 12;
  // What is currently billed and unpaid.
  int64 outstanding_idr = 13;
  int32 grace_period_days = 14;
  optional int32 grace_period_override_days = 15;
  google.protobuf.Timestamp effective_access_until = 16;
  int64 credit_balance_idr = 17;
  // Set once by CancelSubscription (D5) and never cleared — access still
  // runs out on access_until exactly as before, this only stops billing.
  google.protobuf.Timestamp cancelled_at = 18;
  // D4 onboarding-completeness markers (§7.2 DESAIN): has this tenant
  // created a season, and has anyone from it signed in more than once.
  // pilgrim_count above already answers "sudah ada jamaah?".
  int32 season_count = 19;
  // An approximation, not an exact login count — see the SQL comment on
  // PlatformRepository.ListOperators for why an exact count isn't possible
  // (every sign-in deletes every other session for that user).
  bool has_returned_since_signup = 20;
  // D7: set only once access has actually lapsed — access_until (plus grace
  // period) plus 90 days. A tenant still within their paid/trial period has
  // no deletion clock running at all, so this stays unset for them.
  google.protobuf.Timestamp deletion_eligible_at = 21;
}

