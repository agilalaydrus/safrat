  string reference = 3;
  int64 cost_idr = 4;
  // False when the response carries no cost. Distinct from a cost of zero,
  // which would look like a free product.
  bool cost_reported = 5;
  // Rules that could not be applied, with the reason. Normally empty — patterns
  // are validated when saved. Anything here is coverage quietly missing, which
  // is how a supplier drifts into producing nothing but UNMATCHED without
  // anyone realising the rules stopped working rather than the supplier
  // changing shape.
  repeated SkippedResponseRule skipped_rules = 6;
}

message SkippedResponseRule {
  string rule_id = 1;
  string reason = 2;
}

message SupplierLogEntry {
  string id = 1;
  string supplier_name = 2;
  string order_id = 3;
  // REQUEST | CALLBACK
  string direction = 4;
  string endpoint = 5;
  string request_body = 6;
  string response_body = 7;
  int32 http_status = 8;
  string outcome = 9;
  string supplier_reference = 10;
  int64 cost_idr = 11;
  string error = 12;
  google.protobuf.Timestamp created_at = 13;
}

message ListSupplierLogsRequest {
  // Narrows to responses no rule recognised — the queue that keeps the rules
  // honest, since each one is a supplier saying something unreadable.
  bool unmatched_only = 1;
  int32 limit = 2;
  // Set when opening the log from a transaction that is waiting for review.
  optional string order_id = 3 [(buf.validate.field).string.uuid = true];
}
message ListSupplierLogsResponse { repeated SupplierLogEntry logs = 1; }

message PlatformTransaction {
  string order_id = 1;
  string receipt_number = 2;
  string operator_name = 3;
  string pilgrim_name = 4;
  string product_name = 5;
  string category = 6;
  int64 amount_idr = 7;
  // What the gateway reported as paid. Zero when nothing has been reported
  // yet, which is different from a payment of zero.
  int64 paid_amount_idr = 8;
  // What the operator still holds — nothing for an unpaid or refunded one.
  int64 net_paid_idr = 9;
  // PENDING | PAID | HELD | REFUNDED | EXPIRED | FAILED | CANCELLED
  string status = 10;
  string held_reason = 11;
  // The other half of the story: PENDING | SENT | DELIVERED | FAILED |
  // NEEDS_REVIEW, or empty for a product nobody supplies.
  string fulfilment_status = 12;
  string supplier_name = 13;
  string supplier_reference = 14;
  string fulfilment_error = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp paid_at = 17;
  string risk_level = 18;
  string risk_reason = 19;
}

message ListTransactionsRequest {
  // Narrows to what is actually costing somebody: a payment that did not match
  // its bill, a checkout flagged by velocity controls, or something paid for
  // that never arrived.
  bool needs_attention = 1;
  int32 limit = 2;
}
message ListTransactionsResponse { repeated PlatformTransaction transactions = 1; }

message PlatformAccount {
  string user_id = 1;
  string name = 2;
  string email = 3;
  bool email_verified = 4;
  bool two_factor_enabled = 5;
  bool is_platform_admin = 6;
  // Empty for an account belonging to no organisation — a jamaah signing in to
  // see their own schedule.
  string operator_name = 7;
  string org_role = 8;
  int32 active_sessions = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListAccountsRequest {
  string search = 1 [(buf.validate.field).string.max_len = 120];
  int32 limit = 2;
}
message ListAccountsResponse { repeated PlatformAccount accounts = 1; }

message GrantPlatformAdminRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  string note = 2 [(buf.validate.field).string.max_len = 300];
}
message GrantPlatformAdminResponse {}

message RevokePlatformAdminRequest { string user_id = 1 [(buf.validate.field).string.min_len = 1]; }
message RevokePlatformAdminResponse {}

message RevokeSessionsRequest { string user_id = 1 [(buf.validate.field).string.min_len = 1]; }
message RevokeSessionsResponse { int32 sessions_ended = 1; }

message KycRecordSummary {
  string id = 1;
  string operator_name = 2;
  string user_id = 3;
  // AGENT | PILGRIM
  string subject_type = 4;
  string subject_id = 5;
  string full_name = 6;
  // PENDING_REVIEW | VERIFIED | REJECTED
  string status = 7;
  // SELF | STAFF
  string source = 8;
  string verified_by = 9;
  google.protobuf.Timestamp verified_at = 10;
  string rejection_reason = 11;
  google.protobuf.Timestamp created_at = 12;
  // Deliberately absent from the summary: the identity numbers themselves.
  // A list that carries them turns one careless screenshot into a leak of
  // everybody on it.
}

message ListKycRecordsRequest {
  string status = 1 [(buf.validate.field).string = {in: ["", "PENDING_REVIEW", "VERIFIED", "REJECTED"]}];
  int32 limit = 2;
}
message ListKycRecordsResponse { repeated KycRecordSummary records = 1; }

message GetKycRecordRequest {
  string subject_type = 1 [(buf.validate.field).string = {in: ["AGENT", "PILGRIM"]}];
  string subject_id = 2 [(buf.validate.field).string.uuid = true];
}
message GetKycRecordResponse {
  KycRecordSummary summary = 1;
  // In the clear, and audit-logged on every read.
  string nik = 2;
  string npwp = 3;
  string address = 4;
  string place_of_birth = 5;
}

message SetKycStatusRequest {
  string record_id = 1 [(buf.validate.field).string.uuid = true];
  string status = 2 [(buf.validate.field).string = {in: ["VERIFIED", "REJECTED"]}];
  string reason = 3 [(buf.validate.field).string.max_len = 500];
}
message SetKycStatusResponse {}
