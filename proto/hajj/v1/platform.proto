syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
// FunnelStepCount is shared with the per-agency screen deliberately: the two
// funnels are the same shape, and a second copy of the message would let them
// drift apart step by step.
import "hajj/v1/funnel_report.proto";
// SupportTicket/SupportTicketMessage/SupportTicketDetail are shared with the
// operator-facing SupportService deliberately (C5, TUGAS-PANEL-SAAS.md): the
// platform inbox reads and writes the exact same rows, just unscoped by
// tenant, and a second copy of these messages would let the two views drift
// apart field by field.
import "hajj/v1/support.proto";
// DataExportRow is shared with DataExportService (D6, TUGAS-PANEL-SAAS.md):
// RequestTenantDataExport writes into the exact same operator_data_exports
// table, just on the tenant's behalf instead of by their own request.
import "hajj/v1/order.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

// PlatformService is TawafiqHub's own administrative surface, above every
// operator rather than inside one.
//
// It exists so platform work — supplier costs, looking across tenants — stops
// needing a terminal on the VPS. Every method requires a platform admin, which
// is a row in platform_admins granted deliberately at the database, not a role
// any operator can reach. Operator staff, however senior in their own
// organisation, get PermissionDenied here.
//
// Every method is unscoped by design: that is what makes this the platform's
// view rather than a tenant's, and exactly why the authorisation check is the
// most security-critical code in this service.
service PlatformService {
  // AmIPlatformAdmin lets the web app decide whether to show the panel at all,
  // without having to call a method it may not be allowed to call. Reachable
  // by any signed-in user; it answers about the caller and nobody else.
  rpc AmIPlatformAdmin(AmIPlatformAdminRequest) returns (AmIPlatformAdminResponse);

  // ListOperators is every tenant on the platform, with the figures that
  // matter for running it.
  rpc ListOperators(ListOperatorsRequest) returns (ListOperatorsResponse);

  // Package limits and per-tenant exceptions. These live on the platform
  // surface because changing them affects commercial terms across tenants.
  rpc ListPlanLimits(ListPlanLimitsRequest) returns (ListPlanLimitsResponse);
  rpc PreviewPlanLimitChange(PreviewPlanLimitChangeRequest) returns (PreviewPlanLimitChangeResponse);
  rpc SetPlanLimit(SetPlanLimitRequest) returns (SetPlanLimitResponse);
  rpc ListPlanOverrides(ListPlanOverridesRequest) returns (ListPlanOverridesResponse);

  // Subscription billing. Voiding keeps the row: deleting an invoice puts a
  // hole in the billing history exactly where somebody will later look.
  // Who is near a plan ceiling. Read from a daily snapshot rather than counted
  // live: counting every tenant's rows on each panel load would be the most
  // expensive query here, and it would slow down as the business grew.
  rpc ListUsage(ListUsageRequest) returns (ListUsageResponse);
  rpc ListSubscriptionInvoices(ListSubscriptionInvoicesRequest) returns (ListSubscriptionInvoicesResponse);
  rpc PreviewSubscriptionBilling(PreviewSubscriptionBillingRequest) returns (PreviewSubscriptionBillingResponse);
  rpc IssueSubscriptionBilling(IssueSubscriptionBillingRequest) returns (IssueSubscriptionBillingResponse);
  rpc GetSubscriptionBillingSettings(GetSubscriptionBillingSettingsRequest) returns (GetSubscriptionBillingSettingsResponse);
  rpc SetTrialDays(SetTrialDaysRequest) returns (SetTrialDaysResponse);
  rpc SetSubscriptionGracePeriod(SetSubscriptionGracePeriodRequest) returns (SetSubscriptionGracePeriodResponse);
  // D2 (TUGAS-PANEL-SAAS.md, §7.1 DESAIN): a prospect seriously evaluating
  // the product should not be locked out by a calendar. Only ever adds days,
  // and only to a subscription still TRIALING.
  rpc ExtendTrial(ExtendTrialRequest) returns (ExtendTrialResponse);
  // D5 (§7.3 DESAIN): cancellation, not deletion — access_until is left
  // exactly as it is, this only stops billing from trying again.
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse);
  rpc PreviewSubscriptionPlanChange(PreviewSubscriptionPlanChangeRequest) returns (PreviewSubscriptionPlanChangeResponse);
  rpc ApplySubscriptionPlanChange(ApplySubscriptionPlanChangeRequest) returns (ApplySubscriptionPlanChangeResponse);
  rpc VoidSubscriptionInvoice(VoidSubscriptionInvoiceRequest) returns (VoidSubscriptionInvoiceResponse);
  rpc SetPlanOverride(SetPlanOverrideRequest) returns (SetPlanOverrideResponse);
  rpc DeletePlanOverride(DeletePlanOverrideRequest) returns (DeletePlanOverrideResponse);

  // ListProductsNeedingCost surfaces products with no supplier cost recorded.
  // Those sell with no price floor beneath them, so this is the queue that
  // makes the floor real rather than theoretical.
  rpc ListProductsNeedingCost(ListProductsNeedingCostRequest) returns (ListProductsNeedingCostResponse);

  // SetProductSupplierCost records a cost by hand. Refuses to overwrite a cost
  // observed from a supplier's own response — what was actually charged
  // outranks what somebody typed.
  rpc SetProductSupplierCost(SetProductSupplierCostRequest) returns (SetProductSupplierCostResponse);

  // SetProductBasePrice sets what TawafiqHub charges the travel for a product.
  // Platform-only and scoped by product id alone: an operator must not be able
  // to move the price they are charged, which is why it lives here and not on
  // ProductService.
  rpc SetProductBasePrice(SetProductBasePriceRequest) returns (SetProductBasePriceResponse);

  // SavePlatformProduct creates or edits a product TawafiqHub supplies to
  // every travel. These belong to no tenant and no season, and a travel can
  // only set its own markup on top — which is why creating one lives here and
  // not on ProductService.
  rpc SavePlatformProduct(SavePlatformProductRequest) returns (SavePlatformProductResponse);

  // ListPlatformCatalogue returns only the products TawafiqHub supplies.
  // Separate from ListProductsNeedingCost, which spans every tenant: filtering
  // that list down on the client works until the catalogue grows past its
  // limit, and then quietly starts hiding rows.
  rpc ListPlatformCatalogue(ListPlatformCatalogueRequest) returns (ListPlatformCatalogueResponse);

  // ResolveFulfilment closes out a delivery the supplier never answered
  // readably. Until this existed the queue could be read and not worked: a
  // transaction whose outcome nothing could determine sat there permanently,
  // with the jamaah's money already taken and no way to finish it short of
  // opening the database.
  //
  // FAILED refunds. Marking a delivery failed and keeping the money would be
  // worse than the limbo it replaces, because the record would then say the
  // matter was settled.
  //
  // Repeatable on purpose — a wrong decision must be correctable. Refunds are
  // once per order at the database, so repeating it cannot pay twice.
  rpc ResolveFulfilment(ResolveFulfilmentRequest) returns (ResolveFulfilmentResponse);

  // ListPendingTransfers is what somebody reconciling a bank statement needs:
  // the exact amounts still outstanding. Each is unique per day, so an incoming
  // mutation identifies its invoice unambiguously.
  rpc ListPendingTransfers(ListPendingTransfersRequest) returns (ListPendingTransfersResponse);

  // ConfirmBankTransfer settles the invoice carrying an amount that arrived.
  //
  // The matching was already built and had no caller: the unique amount was
  // computed, stored, and then nothing could act on it, so confirming a
  // transfer meant opening the database. This is that step, done by typing the
  // amount off the statement.
  rpc ConfirmBankTransfer(ConfirmBankTransferRequest) returns (ConfirmBankTransferResponse);

  // ListBankMutations shows credits that arrived. Unmatched ones are the queue
  // that matters: money in the account that nothing accounts for.
  rpc ListBankMutations(ListBankMutationsRequest) returns (ListBankMutationsResponse);

  // SettleInvoiceWithMutation attaches a recorded credit to one specific
  // invoice. The fallback for when the feed mis-read an amount, a transfer
  // arrived with a fee deducted, or the scraper broke — a person decides, and
  // the decision is tied to a credit that exists rather than to a typed number.
  rpc SettleInvoiceWithMutation(SettleInvoiceWithMutationRequest) returns (SettleInvoiceWithMutationResponse);

  // IgnoreBankMutation records that a credit is not a subscription payment.
  // Not a delete: the money still arrived.
  rpc IgnoreBankMutation(IgnoreBankMutationRequest) returns (IgnoreBankMutationResponse);

  // Supplier catalogue. Digital products are supplied by the platform, so all
  // of this is platform-owned — a travel neither sets nor sees it.
  rpc ListSuppliers(ListSuppliersRequest) returns (ListSuppliersResponse);
  rpc SaveSupplier(SaveSupplierRequest) returns (SaveSupplierResponse);

  // Which supplier fulfils which product.
  rpc ListProductRoutes(ListProductRoutesRequest) returns (ListProductRoutesResponse);
  rpc SaveProductRoute(SaveProductRouteRequest) returns (SaveProductRouteResponse);

  // How a supplier's answers are read. Patterns rather than code, because
  // suppliers change their response shape without warning and a deploy per
  // change is not a workable answer.
  rpc ListResponseRules(ListResponseRulesRequest) returns (ListResponseRulesResponse);
  rpc CreateResponseRule(CreateResponseRuleRequest) returns (CreateResponseRuleResponse);
  rpc SetResponseRuleActive(SetResponseRuleActiveRequest) returns (SetResponseRuleActiveResponse);
  // TestResponseRules runs a sample response through a supplier's live rules
  // without touching anything. Writing a pattern blind against real money is
  // how bad rules reach production.
  rpc TestResponseRules(TestResponseRulesRequest) returns (TestResponseRulesResponse);

  // What suppliers actually said.
  rpc ListSupplierLogs(ListSupplierLogsRequest) returns (ListSupplierLogsResponse);

  // Every transaction across every tenant, paid or not. A transaction exists
  // in this system from the moment it is created, not from the moment it is
  // paid — an abandoned checkout is still a record, and one that never
  // appeared anywhere would be a gap nobody could investigate.
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);

  // Accounts, and who holds platform access. Granting used to require a SQL
  // client, which is precisely what this panel exists to remove.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc GrantPlatformAdmin(GrantPlatformAdminRequest) returns (GrantPlatformAdminResponse);
  rpc RevokePlatformAdmin(RevokePlatformAdminRequest) returns (RevokePlatformAdminResponse);
  // RevokeSessions signs an account out everywhere. The response to a suspected
  // takeover: resetting a password changes nothing for whoever already holds a
  // live session.
  rpc RevokeSessions(RevokeSessionsRequest) returns (RevokeSessionsResponse);

  // Identity records, kept as their own thing and readable on request.
  rpc ListKycRecords(ListKycRecordsRequest) returns (ListKycRecordsResponse);
  // GetKycRecord returns the identity numbers in the clear, and is audit-logged
  // every time — reading somebody's NIK should leave a trace.
  rpc GetKycRecord(GetKycRecordRequest) returns (GetKycRecordResponse);
  rpc SetKycStatus(SetKycStatusRequest) returns (SetKycStatusResponse);

  // GetPlatformFunnel reads both funnels side by side: TawafiqHub's own sales
  // funnel, and what every travel agency's storefront produced. Only here can
  // the two be compared, which is what separates this from the per-agency
  // screen.
  rpc GetPlatformFunnel(GetPlatformFunnelRequest) returns (GetPlatformFunnelResponse);

  // GetTenantDetail assembles one travel agency's whole picture in a single
  // call. The alternative — the page firing eight list RPCs and filtering in
  // the browser — would pull every other tenant's subscriptions, usage and
  // invoices down to a screen about one of them, and be slower for the
  // trouble.
  rpc GetTenantDetail(GetTenantDetailRequest) returns (GetTenantDetailResponse);

  // Impersonation: looking at a tenant's own dashboard as they see it.
  //
  // Read-only and time-bounded, and written down before it starts. Fixing
  // something for a customer goes through the platform RPCs above, which have
  // their own confirmation and their own audit trail — never by wearing the
  // customer's face.
  rpc StartImpersonation(StartImpersonationRequest) returns (StartImpersonationResponse);
  rpc EndImpersonation(EndImpersonationRequest) returns (EndImpersonationResponse);
  rpc ListImpersonations(ListImpersonationsRequest) returns (ListImpersonationsResponse);

  // Locking a travel agency out on purpose, and letting them back in. Both
  // require the tenant's own name to be typed, and both leave a row in
  // privileged_actions that outlives the decision.
  rpc SuspendTenant(SuspendTenantRequest) returns (SuspendTenantResponse);
  rpc ReinstateTenant(ReinstateTenantRequest) returns (ReinstateTenantResponse);
  rpc ListPrivilegedActions(ListPrivilegedActionsRequest) returns (ListPrivilegedActionsResponse);

  // Who from TawafiqHub has read this tenant's people's data, and how much.
  // Changes were always recorded; reads were not, and a support session can
  // page through every jamaah without changing a thing.
  rpc ListPersonalDataReads(ListPersonalDataReadsRequest) returns (ListPersonalDataReadsResponse);

  // GetPlatformAnalytics is whether the business is growing. Every figure here
  // is derived from live rows, and every limit of that is stated on the screen
  // rather than left for somebody to discover from a decision that went wrong.
  rpc GetPlatformAnalytics(GetPlatformAnalyticsRequest) returns (GetPlatformAnalyticsResponse);

  // GetPlatformHealth reads only what a customer would feel. Not an
  // infrastructure console: mixing CPU graphs in makes the list too long to
  // read at the moment something is actually wrong.
  rpc GetPlatformHealth(GetPlatformHealthRequest) returns (GetPlatformHealthResponse);

  // ListAuditTrail is the global trail, filtered the way an incident is
  // actually investigated. Read-only without exception: migration 125 removed
  // UPDATE and DELETE from the application role, so there is nothing to offer
  // here but reading.
  rpc ListAuditTrail(ListAuditTrailRequest) returns (ListAuditTrailResponse);

  // ExportAuditTrail streams the same trail as ListAuditTrail (same filters,
  // no limit) as CSV bytes, ending with one AuditExportManifest message.
  // "Streams as CSV bytes" rather than typed rows on purpose (see C4,
  // TUGAS-PANEL-SAAS.md): the manifest's sha256 is computed server-side over
  // the exact bytes sent, so the client only ever has to write what it
  // receives, never re-encode it — there is no way for the downloaded file
  // and the hash that vouches for it to disagree.
  rpc ExportAuditTrail(ExportAuditTrailRequest) returns (stream AuditExportChunk);

  // C5 (TUGAS-PANEL-SAAS.md): the platform-side half of Support. The
  // operator-facing half (create a ticket, read it, reply, close it) is
  // SupportService — this is the admin inbox across every tenant.
  rpc ListAllSupportTickets(ListAllSupportTicketsRequest) returns (ListAllSupportTicketsResponse);
  rpc GetSupportTicketAsPlatform(GetSupportTicketAsPlatformRequest) returns (SupportTicketDetail);
  // ReplyToSupportTicketAsPlatform writes with author_is_platform = true —
  // the operator's own thread view (SupportService.GetSupportTicket) shows
  // it automatically, no change needed on that side.
  rpc ReplyToSupportTicketAsPlatform(ReplyToSupportTicketAsPlatformRequest) returns (SupportTicketMessage);
  // SetSupportTicketStatus moves a ticket between OPEN, IN_PROGRESS and
  // RESOLVED only — CLOSED is deliberately unreachable here. Closing is the
  // operator's own decision (SupportService.CloseSupportTicket); it is not
  // this RPC's to make.
  rpc SetSupportTicketStatus(SetSupportTicketStatusRequest) returns (SupportTicket);

  // D6/D7 (TUGAS-PANEL-SAAS.md, §7.3 DESAIN): tenant deletion, 90 days after
  // access ends. RequestTenantDataExport is the "wajib ditawarkan" step —
  // the portability right — and DeleteTenant refuses outright if one was
  // never produced. See internal/repository/platform_deletion.go for the
  // three preconditions enforced server-side, not just suggested by the UI.
  rpc RequestTenantDataExport(RequestTenantDataExportRequest) returns (DataExportRow);
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);
}

message RequestTenantDataExportRequest {
  string operator_id = 1 [(buf.validate.field).string.uuid = true];
  string idempotency_key = 2 [(buf.validate.field).string = {min_len: 8, max_len: 128}];
}

message DeleteTenantRequest {
  string operator_id = 1 [(buf.validate.field).string.uuid = true];
  string reason = 2 [(buf.validate.field).string = {min_len: 10, max_len: 500}];
  // The tenant's own name, typed by hand — same mistake-proofing as
  // Suspend/Reinstate, and for the same reason this is the one action in
  // the system where clicking the wrong row matters most.
  string confirmation = 3 [(buf.validate.field).string = {min_len: 1, max_len: 160}];
  string idempotency_key = 4 [(buf.validate.field).string = {min_len: 8, max_len: 128}];
}

message DeleteTenantResponse {
  string operator_id = 1;
  string operator_name = 2;
  google.protobuf.Timestamp deleted_at = 3;
}

message ListAllSupportTicketsRequest {
  string status = 1; // "" (all) | OPEN | IN_PROGRESS | RESOLVED | CLOSED
  string priority = 2; // "" (all) | LOW | MEDIUM | HIGH | URGENT
}

message ListAllSupportTicketsResponse {
  repeated SupportTicket tickets = 1;
}

message GetSupportTicketAsPlatformRequest {
  string ticket_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ReplyToSupportTicketAsPlatformRequest {
  string ticket_id = 1 [(buf.validate.field).string.min_len = 1];
  string body = 2 [(buf.validate.field).string.min_len = 1];
}

message SetSupportTicketStatusRequest {
  string ticket_id = 1 [(buf.validate.field).string.min_len = 1];
  string status = 2 [(buf.validate.field).string = {in: ["OPEN", "IN_PROGRESS", "RESOLVED"]}];
}

// Same fields as ListAuditTrailRequest minus limit, which means nothing for
// an export that streams every matching row — kept as its own message
// because the two requests mean different things even when their filters
// happen to match (see PLATFORM_SERVICE naming lint).
message ExportAuditTrailRequest {
  string operator_id = 1;
  string actor = 2;
  string category = 3;
  int32 days = 4;
}

message AuditExportChunk {
  oneof payload {
    bytes csv_chunk = 1;
    // Sent exactly once, as the last message on the stream.
    AuditExportManifest manifest = 2;
  }
}

message AuditExportManifest {
  // Hex-encoded SHA-256 of the full CSV byte stream (header row included).
  string sha256 = 1;
  string signed_at = 2; // RFC3339
  // Identifies which AUDIT_EXPORT_SIGNING_KEY produced hmac_sha256, without
  // revealing it — see internal/crypto.Signer.Fingerprint.
  string key_fingerprint = 3;
  // Hex-encoded HMAC-SHA256(sha256 above, the signing key). An auditor who
  // independently recomputes the CSV's SHA-256 and gets a different value
  // than this manifest's sha256 knows the file was altered; one who has the
  // key can additionally confirm the manifest itself came from this platform.
  string hmac_sha256 = 4;
}

message ListAuditTrailRequest {
  string operator_id = 1;
  // Matched against the account's email as well as its id: an incident starts
  // from a person, and nobody remembers a Better Auth user id.
  string actor = 2;
  // ALL | PRIVILEGED | IMPERSONATION | PERSONAL_DATA. Named sets rather than
  // free text, because these are the questions asked under pressure and a
  // search box makes somebody recall the exact spelling of an action.
  string category = 3;
  int32 days = 4;
  int32 limit = 5;
}

message AuditTrailEntry {
  string id = 1;
  google.protobuf.Timestamp at = 2;
  string actor = 3;
  string actor_id = 4;
  string action = 5;
  string entity_type = 6;
  string entity_id = 7;
  string operator_id = 8;
  string operator_name = 9;
  string message = 10;
}

message ListAuditTrailResponse {
  repeated AuditTrailEntry entries = 1;
  // True when the result was cut off by the limit, so the screen can say the
  // list is incomplete rather than implying nothing else happened.
  bool truncated = 2;
}

message GetPlatformHealthRequest {}

message HealthSignal {
  string key = 1;
  string title = 2;
  // OK | WARN | ALERT | UNMONITORED
  //
  // Four values, not two. A screen with only "fine" and "broken" has to call
  // something fine when nobody is checking it, and a green light that watches
  // nothing is worse than no light at all.
  string status = 3;
  string detail = 4;
  int32 affected_tenants = 5;
  int64 count = 6;
  // Which table the number came from, so somebody reading this at 2am does not
  // have to guess.
  string source = 7;
  google.protobuf.Timestamp oldest_seen = 8;
}

message GetPlatformHealthResponse {
  repeated HealthSignal signals = 1;
  google.protobuf.Timestamp checked_at = 2;
}

message GetPlatformAnalyticsRequest {
  int32 days = 1;
}

message PlanRevenueRow {
  string plan = 1;
  int64 monthly_idr = 2;
  int32 paying_tenants = 3;
  int64 mrr_idr = 4;
  int32 trial_tenants = 5;
  int32 lapsed_tenants = 6;
}

message GetPlatformAnalyticsResponse {
  // Recurring subscription revenue only. Marketplace commission is other
  // income and is deliberately absent: mixing the two makes growth look faster
  // than it is.
  int64 mrr_idr = 1;
  int32 paying_tenants = 2;
  int32 trialing_tenants = 3;
  int32 suspended_tenants = 4;
  // Not cancelled, not suspended, but past the end of what they paid for.
  int32 lapsed_tenants = 5;

  int64 new_mrr_idr = 6;
  int64 expansion_mrr_idr = 7;
  int64 contraction_mrr_idr = 8;
  int64 churned_mrr_idr = 9;
  int32 churned_tenants = 10;
  // Reconstructed from the movements rather than remembered, because no
  // monthly snapshot is kept.
  int64 mrr_at_window_start = 11;

  int32 trials_started = 12;
  int32 trials_converted = 13;

  repeated PlanRevenueRow by_plan = 14;
  int32 days = 15;
}

message ListPersonalDataReadsRequest {
  string operator_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 limit = 2;
}

message PersonalDataReadRow {
  string actor = 1;
  string procedure = 2;
  // Asia/Jakarta calendar day, as text for the same reason the funnel sends
  // one: a timestamp invites the browser to re-derive the day in its own zone.
  string day = 3;
  int32 read_count = 4;
  string last_at = 5;
  // Whether the read happened inside an impersonation session rather than from
  // the platform panel.
  bool inside_tenant_view = 6;
}

message ListPersonalDataReadsResponse { repeated PersonalDataReadRow reads = 1; }

message SuspendTenantRequest {
  string operator_id = 1 [(buf.validate.field).string.min_len = 1];
  string reason = 2 [(buf.validate.field).string = {min_len: 10, max_len: 500}];
  // The tenant's own name, typed by hand. Compared server-side against the real
  // name — a confirmation the caller both supplies and is checked against would
  // confirm nothing.
  string confirmation = 3 [(buf.validate.field).string = {min_len: 1, max_len: 200}];
  string idempotency_key = 4 [(buf.validate.field).string = {min_len: 8, max_len: 128}];
}

message SuspendTenantResponse {
  string operator_id = 1;
  string operator_name = 2;
  google.protobuf.Timestamp suspended_at = 3;
  // Left untouched by the suspension: the time already paid for keeps running,
  // so lifting the lock returns exactly what the tenant bought.
  google.protobuf.Timestamp access_until = 4;
}

message ReinstateTenantRequest {
  string operator_id = 1 [(buf.validate.field).string.min_len = 1];
  string reason = 2 [(buf.validate.field).string = {min_len: 10, max_len: 500}];
  string confirmation = 3 [(buf.validate.field).string = {min_len: 1, max_len: 200}];
  string idempotency_key = 4 [(buf.validate.field).string = {min_len: 8, max_len: 128}];
}

message ReinstateTenantResponse {
  string operator_id = 1;
  string operator_name = 2;
  google.protobuf.Timestamp access_until = 3;
}

message ListPrivilegedActionsRequest {
  string operator_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 limit = 2;
}

message PrivilegedActionRow {
  string id = 1;
  // SUSPEND | REINSTATE | SET_PLAN_LIMIT | SET_SETTLEMENT | DELETE_TENANT
  string kind = 2;
  string reason = 3;
  string requested_by = 4;
  string approved_by = 5;
  google.protobuf.Timestamp requested_at = 6;
  google.protobuf.Timestamp executed_at = 7;
  // How many platform admins existed when this was requested. One means
  // self-approval was the only path available, and the row says so rather than
  // leaving a reader to assume the rule was ignored.
  int32 admin_count_at_request = 8;
}

message ListPrivilegedActionsResponse { repeated PrivilegedActionRow actions = 1; }

message StartImpersonationRequest {
  string operator_id = 1 [(buf.validate.field).string.min_len = 1];
  // Long enough to be a sentence. This is the only thing that will explain the
  // session a year from now, and "test" explains nothing.
  string reason = 2 [(buf.validate.field).string = {min_len: 10, max_len: 500}];
  // Capped server-side whatever is asked for.
  int32 minutes = 3 [(buf.validate.field).int32 = {gte: 1, lte: 60}];
  string idempotency_key = 4 [(buf.validate.field).string.min_len = 8];
}

message StartImpersonationResponse {
  // Returned exactly once and never stored in a form that can be read back.
  // Losing it means starting a new session.
  string token = 1;
  string session_id = 2;
  string operator_name = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message EndImpersonationRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
}
message EndImpersonationResponse {}

message ListImpersonationsRequest {
  string operator_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 limit = 2;
}

message ImpersonationRow {
  string id = 1;
  // Email where the account still exists, the raw id otherwise.
  string admin = 2;
  string reason = 3;
  string ip = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp ended_at = 7;
  string ended_reason = 8;
}

message ListImpersonationsResponse { repeated ImpersonationRow sessions = 1; }

message GetTenantDetailRequest {
  string operator_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Counts a support conversation actually starts from: is this tenant using the
// product, and how much is inside it.
message TenantCounts {
  int32 pilgrims = 1;
  int32 branches = 2;
  int32 seasons = 3;
  int32 products = 4;
  int32 registrations = 5;
  int32 held_orders = 6;
  int32 kyc_pending = 7;
  int32 kyc_verified = 8;
  int32 staff = 9;
}

// One member of the agency's team. two_factor_enabled is here because an
// account with platform-adjacent reach and no second factor is a finding, not
// a detail.
message TenantTeamMember {
  string user_id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
  bool two_factor_enabled = 5;
  google.protobuf.Timestamp joined_at = 6;
}

message TenantDomain {
  string hostname = 1;
  bool is_primary = 2;
  google.protobuf.Timestamp verified_at = 3;
}

message TenantAuditEntry {
  google.protobuf.Timestamp at = 1;
  // Email where the account still exists, the raw id otherwise: an audit line
  // whose actor has been deleted still has to name somebody.
  string actor = 2;
  string action = 3;
  string entity_type = 4;
  string entity_id = 5;
}

message GetTenantDetailResponse {
  PlatformOperator operator = 1;
  // Limits actually in force, and the override that changed them if there is
  // one. Absent override means the plan's own limits apply.
  repeated UsageRow usage = 2;
  PlatformPlanOverride override = 3;
  bool has_override = 4;

  repeated SubscriptionInvoiceRow invoices = 5;
  TenantCounts counts = 6;
  repeated TenantTeamMember team = 7;
  repeated TenantDomain domains = 8;
  repeated TenantAuditEntry audit = 9;
  // This tenant's own storefront funnel over the last 30 days, so the screen
  // reads subscription, usage and demand together.
  StorefrontFunnelRow funnel = 10;
}

message GetPlatformFunnelRequest {
  int32 days = 1;
}

// One storefront's standing. Conversion is the number that matters and the
// number that misleads: a storefront with three visitors and one registrant
// converts at 33%, which says nothing. visitors is carried alongside so the
// screen can refuse to rank the ones with too little traffic to judge.
message StorefrontFunnelRow {
  string operator_id = 1;
  string operator_name = 2;
  string slug = 3;
  int32 visitors = 4;
  int32 registrations = 5;
  double conversion = 6;
}

message GetPlatformFunnelResponse {
  // TawafiqHub's own funnel: the landing page, the sign-up page, and the
  // tenants that actually became active in the period. The last step is
  // counted from operators rather than from funnel events — a sign-up that
  // never became a paying tenant is not a conversion.
  repeated FunnelStepCount platform_steps = 1;
  int32 new_tenants = 2;

  // Every storefront added together. The number to quote when selling.
  int32 total_visitors = 3;
  int32 total_registrations = 4;

  // Ranked by conversion, best first, and only storefronts with enough traffic
  // to be worth ranking.
  repeated StorefrontFunnelRow storefronts = 5;
  // Below the traffic floor: ranking them would be noise, hiding them would
  // lose them. The floor itself is sent so the screen can say what it is.
  repeated StorefrontFunnelRow too_few_visitors = 6;
  int32 ranking_floor = 7;

  // Paying for a storefront nobody opened. This is a work list, not a shaming
  // board: an agency that pays for something unused is an agency about to
  // cancel.
  repeated StorefrontFunnelRow silent_storefronts = 8;

  int32 days = 9;
}

