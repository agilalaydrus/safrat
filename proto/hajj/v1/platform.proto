syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

// PlatformService is TawafiqHub's own administrative surface, above every
// operator rather than inside one.
//
// It exists so platform work — supplier costs, looking across tenants — stops
// needing a terminal on the VPS. Every method requires a platform admin, which
// is a row in platform_admins granted deliberately at the database, not a role
// any operator can reach. Operator staff, however senior in their own
// organisation, get PermissionDenied here.
//
// Every method is unscoped by design: that is what makes this the platform's
// view rather than a tenant's, and exactly why the authorisation check is the
// most security-critical code in this service.
service PlatformService {
  // AmIPlatformAdmin lets the web app decide whether to show the panel at all,
  // without having to call a method it may not be allowed to call. Reachable
  // by any signed-in user; it answers about the caller and nobody else.
  rpc AmIPlatformAdmin(AmIPlatformAdminRequest) returns (AmIPlatformAdminResponse);

  // ListOperators is every tenant on the platform, with the figures that
  // matter for running it.
  rpc ListOperators(ListOperatorsRequest) returns (ListOperatorsResponse);

  // Package limits and per-tenant exceptions. These live on the platform
  // surface because changing them affects commercial terms across tenants.
  rpc ListPlanLimits(ListPlanLimitsRequest) returns (ListPlanLimitsResponse);
  rpc PreviewPlanLimitChange(PreviewPlanLimitChangeRequest) returns (PreviewPlanLimitChangeResponse);
  rpc SetPlanLimit(SetPlanLimitRequest) returns (SetPlanLimitResponse);
  rpc ListPlanOverrides(ListPlanOverridesRequest) returns (ListPlanOverridesResponse);
  rpc SetPlanOverride(SetPlanOverrideRequest) returns (SetPlanOverrideResponse);
  rpc DeletePlanOverride(DeletePlanOverrideRequest) returns (DeletePlanOverrideResponse);

  // ListProductsNeedingCost surfaces products with no supplier cost recorded.
  // Those sell with no price floor beneath them, so this is the queue that
  // makes the floor real rather than theoretical.
  rpc ListProductsNeedingCost(ListProductsNeedingCostRequest) returns (ListProductsNeedingCostResponse);

  // SetProductSupplierCost records a cost by hand. Refuses to overwrite a cost
  // observed from a supplier's own response — what was actually charged
  // outranks what somebody typed.
  rpc SetProductSupplierCost(SetProductSupplierCostRequest) returns (SetProductSupplierCostResponse);

  // SetProductBasePrice sets what TawafiqHub charges the travel for a product.
  // Platform-only and scoped by product id alone: an operator must not be able
  // to move the price they are charged, which is why it lives here and not on
  // ProductService.
  rpc SetProductBasePrice(SetProductBasePriceRequest) returns (SetProductBasePriceResponse);

  // SavePlatformProduct creates or edits a product TawafiqHub supplies to
  // every travel. These belong to no tenant and no season, and a travel can
  // only set its own markup on top — which is why creating one lives here and
  // not on ProductService.
  rpc SavePlatformProduct(SavePlatformProductRequest) returns (SavePlatformProductResponse);

  // ListPlatformCatalogue returns only the products TawafiqHub supplies.
  // Separate from ListProductsNeedingCost, which spans every tenant: filtering
  // that list down on the client works until the catalogue grows past its
  // limit, and then quietly starts hiding rows.
  rpc ListPlatformCatalogue(ListPlatformCatalogueRequest) returns (ListPlatformCatalogueResponse);

  // ResolveFulfilment closes out a delivery the supplier never answered
  // readably. Until this existed the queue could be read and not worked: a
  // transaction whose outcome nothing could determine sat there permanently,
  // with the jamaah's money already taken and no way to finish it short of
  // opening the database.
  //
  // FAILED refunds. Marking a delivery failed and keeping the money would be
  // worse than the limbo it replaces, because the record would then say the
  // matter was settled.
  //
  // Repeatable on purpose — a wrong decision must be correctable. Refunds are
  // once per order at the database, so repeating it cannot pay twice.
  rpc ResolveFulfilment(ResolveFulfilmentRequest) returns (ResolveFulfilmentResponse);

  // ListPendingTransfers is what somebody reconciling a bank statement needs:
  // the exact amounts still outstanding. Each is unique per day, so an incoming
  // mutation identifies its invoice unambiguously.
  rpc ListPendingTransfers(ListPendingTransfersRequest) returns (ListPendingTransfersResponse);

  // ConfirmBankTransfer settles the invoice carrying an amount that arrived.
  //
  // The matching was already built and had no caller: the unique amount was
  // computed, stored, and then nothing could act on it, so confirming a
  // transfer meant opening the database. This is that step, done by typing the
  // amount off the statement.
  rpc ConfirmBankTransfer(ConfirmBankTransferRequest) returns (ConfirmBankTransferResponse);

  // ListBankMutations shows credits that arrived. Unmatched ones are the queue
  // that matters: money in the account that nothing accounts for.
  rpc ListBankMutations(ListBankMutationsRequest) returns (ListBankMutationsResponse);

  // SettleInvoiceWithMutation attaches a recorded credit to one specific
  // invoice. The fallback for when the feed mis-read an amount, a transfer
  // arrived with a fee deducted, or the scraper broke — a person decides, and
  // the decision is tied to a credit that exists rather than to a typed number.
  rpc SettleInvoiceWithMutation(SettleInvoiceWithMutationRequest) returns (SettleInvoiceWithMutationResponse);

  // IgnoreBankMutation records that a credit is not a subscription payment.
  // Not a delete: the money still arrived.
  rpc IgnoreBankMutation(IgnoreBankMutationRequest) returns (IgnoreBankMutationResponse);

  // Supplier catalogue. Digital products are supplied by the platform, so all
  // of this is platform-owned — a travel neither sets nor sees it.
  rpc ListSuppliers(ListSuppliersRequest) returns (ListSuppliersResponse);
  rpc SaveSupplier(SaveSupplierRequest) returns (SaveSupplierResponse);

  // Which supplier fulfils which product.
  rpc ListProductRoutes(ListProductRoutesRequest) returns (ListProductRoutesResponse);
  rpc SaveProductRoute(SaveProductRouteRequest) returns (SaveProductRouteResponse);

  // How a supplier's answers are read. Patterns rather than code, because
  // suppliers change their response shape without warning and a deploy per
  // change is not a workable answer.
  rpc ListResponseRules(ListResponseRulesRequest) returns (ListResponseRulesResponse);
  rpc CreateResponseRule(CreateResponseRuleRequest) returns (CreateResponseRuleResponse);
  rpc SetResponseRuleActive(SetResponseRuleActiveRequest) returns (SetResponseRuleActiveResponse);
  // TestResponseRules runs a sample response through a supplier's live rules
  // without touching anything. Writing a pattern blind against real money is
  // how bad rules reach production.
  rpc TestResponseRules(TestResponseRulesRequest) returns (TestResponseRulesResponse);

  // What suppliers actually said.
  rpc ListSupplierLogs(ListSupplierLogsRequest) returns (ListSupplierLogsResponse);

  // Every transaction across every tenant, paid or not. A transaction exists
  // in this system from the moment it is created, not from the moment it is
  // paid — an abandoned checkout is still a record, and one that never
  // appeared anywhere would be a gap nobody could investigate.
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);

  // Accounts, and who holds platform access. Granting used to require a SQL
  // client, which is precisely what this panel exists to remove.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc GrantPlatformAdmin(GrantPlatformAdminRequest) returns (GrantPlatformAdminResponse);
  rpc RevokePlatformAdmin(RevokePlatformAdminRequest) returns (RevokePlatformAdminResponse);
  // RevokeSessions signs an account out everywhere. The response to a suspected
  // takeover: resetting a password changes nothing for whoever already holds a
  // live session.
  rpc RevokeSessions(RevokeSessionsRequest) returns (RevokeSessionsResponse);

  // Identity records, kept as their own thing and readable on request.
  rpc ListKycRecords(ListKycRecordsRequest) returns (ListKycRecordsResponse);
  // GetKycRecord returns the identity numbers in the clear, and is audit-logged
  // every time — reading somebody's NIK should leave a trace.
  rpc GetKycRecord(GetKycRecordRequest) returns (GetKycRecordResponse);
  rpc SetKycStatus(SetKycStatusRequest) returns (SetKycStatusResponse);
}

message AmIPlatformAdminRequest {}
message AmIPlatformAdminResponse {
  bool is_platform_admin = 1;
  // Whether the caller's account has a second factor enrolled. Platform access
  // requires it, so the panel needs both answers to tell "you have no access"
  // apart from "you have access but must enrol first".
  bool two_factor_enabled = 2;
}

message PlatformOperator {
  string id = 1;
  string name = 2;
  string slug = 3;
  string plan = 4;
  string subscription_status = 5;
  google.protobuf.Timestamp access_until = 6;
  int32 pilgrim_count = 7;
  int32 product_count = 8;
  // Transactions sitting in HELD across this operator — money that arrived and
  // is waiting on somebody's decision.
  int32 held_order_count = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListOperatorsRequest {}
message ListOperatorsResponse { repeated PlatformOperator operators = 1; }

// QuotaValue keeps zero distinct from unlimited. An absent integer cannot do
// that reliably across Go and TypeScript protobuf runtimes.
message QuotaValue {
  bool unlimited = 1;
  int32 value = 2 [(buf.validate.field).int32.gte = 0];
}

message PlatformPlanLimit {
  string plan = 1;
  QuotaValue max_pilgrims = 2;
  QuotaValue max_branches = 3;
  map<string, bool> feature_flags = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ListPlanLimitsRequest {}
message ListPlanLimitsResponse { repeated PlatformPlanLimit limits = 1; }

message AffectedTenant {
  string operator_id = 1;
  string name = 2;
  int32 pilgrim_count = 3;
  int32 active_branch_count = 4;
  QuotaValue current_max_pilgrims = 5;
  QuotaValue current_max_branches = 6;
  repeated string reasons = 7;
}

message PreviewPlanLimitChangeRequest {
  string plan = 1 [(buf.validate.field).string = {in: ["STARTER", "GROWTH", "PRO"]}];
  QuotaValue max_pilgrims = 2 [(buf.validate.field).required = true];
  QuotaValue max_branches = 3 [(buf.validate.field).required = true];
  map<string, bool> feature_flags = 4;
}
message PreviewPlanLimitChangeResponse { repeated AffectedTenant affected_tenants = 1; }

message SetPlanLimitRequest {
  string plan = 1 [(buf.validate.field).string = {in: ["STARTER", "GROWTH", "PRO"]}];
  QuotaValue max_pilgrims = 2 [(buf.validate.field).required = true];
  QuotaValue max_branches = 3 [(buf.validate.field).required = true];
  map<string, bool> feature_flags = 4;
  string reason = 5 [(buf.validate.field).string = {min_len: 1, max_len: 500}];
  // The plan name must be typed again for today's single-admin approval path.
  string confirmation = 6 [(buf.validate.field).string = {min_len: 1, max_len: 20}];
  string idempotency_key = 7 [(buf.validate.field).string = {min_len: 8, max_len: 128}];
  bool grandfather_affected = 8;
}
message SetPlanLimitResponse {
  PlatformPlanLimit limit = 1;
  int32 grandfathered_tenants = 2;
}

message PlatformPlanOverride {
  string operator_id = 1;
  string operator_name = 2;
  string plan = 3;
  optional int32 max_pilgrims = 4 [(buf.validate.field).int32.gte = 0];
  optional int32 max_branches = 5 [(buf.validate.field).int32.gte = 0];
  map<string, bool> feature_flag_overrides = 6;
  string note = 7;
  google.protobuf.Timestamp expires_at = 8;
  string updated_by = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message ListPlanOverridesRequest { bool include_expired = 1; }
message ListPlanOverridesResponse { repeated PlatformPlanOverride overrides = 1; }

message SetPlanOverrideRequest {
  string operator_id = 1 [(buf.validate.field).string.uuid = true];
  optional int32 max_pilgrims = 2 [(buf.validate.field).int32.gte = 0];
  optional int32 max_branches = 3 [(buf.validate.field).int32.gte = 0];
  map<string, bool> feature_flag_overrides = 4;
  string note = 5 [(buf.validate.field).string = {min_len: 1, max_len: 500}];
  google.protobuf.Timestamp expires_at = 6;
  string idempotency_key = 7 [(buf.validate.field).string = {min_len: 8, max_len: 128}];
}
message SetPlanOverrideResponse { PlatformPlanOverride override = 1; }

message DeletePlanOverrideRequest {
  string operator_id = 1 [(buf.validate.field).string.uuid = true];
  string reason = 2 [(buf.validate.field).string = {min_len: 1, max_len: 500}];
  string idempotency_key = 3 [(buf.validate.field).string = {min_len: 8, max_len: 128}];
}
message DeletePlanOverrideResponse {}

message PlatformProduct {
  string id = 1;
  string operator_id = 2;
  string operator_name = 3;
  string season_name = 4;
  string name = 5;
  string category = 6;
  int64 price_idr = 7;
  int64 supplier_cost_idr = 8;
  // MANUAL, OBSERVED, or empty when nothing is known.
  string supplier_cost_source = 9;
  google.protobuf.Timestamp supplier_cost_updated_at = 10;

  // What TawafiqHub charges the travel. base_price_set distinguishes an unset
  // base from a zero one; a product with no base cannot be sold at all, so the
  // two must not look alike on this screen.
  int64 base_price_idr = 11;
  bool base_price_set = 12;

  // Carried so the admin catalogue can edit a row without a second fetch.
  // The screen that lists is the screen that edits.
  string code = 13;
  int64 nominal_idr = 14;
  string description = 15;
  bool is_active = 16;
}

message ListProductsNeedingCostRequest {
  // When false, only products with no cost at all are returned — the ones
  // selling with no floor. When true, everything, for reviewing costs that are
  // known but may be stale.
  bool include_costed = 1;
}
message ListProductsNeedingCostResponse { repeated PlatformProduct products = 1; }

message SetProductSupplierCostRequest {
  string product_id = 1 [(buf.validate.field).string.uuid = true];
  int64 supplier_cost_idr = 2 [(buf.validate.field).int64.gte = 0];
}
message SetProductSupplierCostResponse { PlatformProduct product = 1; }

message SetProductBasePriceRequest {
  string product_id = 1 [(buf.validate.field).string.uuid = true];
  int64 base_price_idr = 2 [(buf.validate.field).int64.gte = 0];
}
message SetProductBasePriceResponse { PlatformProduct product = 1; }

message SavePlatformProductRequest {
  // Empty creates; a uuid edits. One RPC rather than two because the fields
  // are identical and a split would let the two drift.
  string product_id = 1;
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 160}];
  // What a person quotes: PULSA-TSEL-10K, not a uuid. Unique across the
  // platform catalogue.
  string code = 3 [(buf.validate.field).string = {min_len: 1, max_len: 60}];
  string category = 4 [(buf.validate.field).string = {min_len: 1, max_len: 40}];
  // Face value the customer receives — 10.000 of pulsa. Zero means the product
  // has none, which is why it is not the same field as the price.
  int64 nominal_idr = 5 [(buf.validate.field).int64.gte = 0];
  // What TawafiqHub charges the travel. Every travel's price is built up from
  // this.
  int64 base_price_idr = 6 [(buf.validate.field).int64.gte = 0];
  string description = 7 [(buf.validate.field).string.max_len = 2000];
  bool is_active = 8;
}
message SavePlatformProductResponse { PlatformProduct product = 1; }

message PendingTransfer {
  string invoice_id = 1;
  string operator_name = 2;
  string plan = 3;
  // The figure to look for in the statement. Unique per day by construction.
  int64 amount_idr = 4;
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message ListPendingTransfersRequest {}
message ListPendingTransfersResponse { repeated PendingTransfer transfers = 1; }

message ConfirmBankTransferRequest {
  // Taken from the bank statement, to the rupiah. The unique suffix is the
  // whole identifying mechanism, so a rounded figure matches nothing — which is
  // the correct outcome, not a bug to work around.
  int64 amount_idr = 1 [(buf.validate.field).int64.gt = 0];
}
message ConfirmBankTransferResponse {
  string invoice_id = 1;
  string operator_name = 2;
  int64 amount_idr = 3;
}

message BankMutation {
  string id = 1;
  string external_id = 2;
  // API, SCRAPER or MANUAL. They carry different weight: a scraped row is a
  // best-effort reading of a web page.
  string source = 3;
  int64 amount_idr = 4;
  string description = 5;
  google.protobuf.Timestamp occurred_at = 6;
  string status = 7;
  string matched_invoice_id = 8;
  string note = 9;
}

message ListBankMutationsRequest { bool unmatched_only = 1; }
message ListBankMutationsResponse { repeated BankMutation mutations = 1; }

message SettleInvoiceWithMutationRequest {
  string mutation_id = 1 [(buf.validate.field).string.uuid = true];
  string invoice_id = 2 [(buf.validate.field).string.uuid = true];
  // Required. A manual match is confirmed by nothing outside the system.
  string note = 3 [(buf.validate.field).string = {min_len: 1, max_len: 500}];
}
message SettleInvoiceWithMutationResponse {}

message IgnoreBankMutationRequest {
  string mutation_id = 1 [(buf.validate.field).string.uuid = true];
  string note = 2 [(buf.validate.field).string = {min_len: 1, max_len: 500}];
}
message IgnoreBankMutationResponse {}

message ResolveFulfilmentRequest {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
  // DELIVERED or FAILED. Nothing else: "probably fine" is the state being
  // resolved, not an answer.
  string status = 2 [(buf.validate.field).string = {in: ["DELIVERED", "FAILED"]}];
  // Required. This decision is confirmed by nothing outside the system, so the
  // reason is the entire accountability trail for it.
  string note = 3 [(buf.validate.field).string = {min_len: 1, max_len: 500}];
}
message ResolveFulfilmentResponse {
  string status = 1;
  // True when the resolution returned the money. Reported rather than inferred,
  // so the screen states what happened instead of implying it.
  bool refunded = 2;
  int64 refunded_idr = 3;
}

message ListPlatformCatalogueRequest {}
message ListPlatformCatalogueResponse { repeated PlatformProduct products = 1; }

message PlatformSupplier {
  string id = 1;
  string name = 2;
  // Stable machine name, used in logs and routing so a display rename never
  // orphans history.
  string code = 3;
  string base_url = 4;
  // Names the environment variable holding this supplier's credentials. The
  // credentials themselves are never stored, so a database dump carries none.
  string credential_env_var = 5;
  // ACTIVE | INACTIVE | SUSPENDED
  string status = 6;
  string notes = 7;
  int32 route_count = 8;
  int32 rule_count = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListSuppliersRequest {}
message ListSuppliersResponse { repeated PlatformSupplier suppliers = 1; }

message SaveSupplierRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 120}];
  // Upserted on: saving an existing code updates it rather than creating a
  // second supplier.
  string code = 2 [(buf.validate.field).string = {min_len: 2, max_len: 40, pattern: "^[a-z0-9_-]+$"}];
  string base_url = 3 [(buf.validate.field).string.max_len = 300];
  string credential_env_var = 4 [(buf.validate.field).string.max_len = 100];
  string status = 5 [(buf.validate.field).string = {in: ["ACTIVE", "INACTIVE", "SUSPENDED"]}];
  string notes = 6 [(buf.validate.field).string.max_len = 1000];
}
message SaveSupplierResponse { PlatformSupplier supplier = 1; }

message PlatformProductRoute {
  // Empty when the product has no route at all. Those rows are the work queue:
  // an order for an unrouted product comes back "Produk Belum di Atur Routing",
  // so they are listed first rather than hidden.
  string id = 1;
  string product_id = 2;
  string product_name = 3;
  string operator_name = 4;
  string category = 5;
  string supplier_id = 6;
  string supplier_name = 7;
  string supplier_sku = 8;
  bool is_active = 9;
}

message ListProductRoutesRequest {}
message ListProductRoutesResponse { repeated PlatformProductRoute routes = 1; }

message SaveProductRouteRequest {
  string product_id = 1 [(buf.validate.field).string.uuid = true];
  string supplier_id = 2 [(buf.validate.field).string.uuid = true];
  string supplier_sku = 3 [(buf.validate.field).string = {min_len: 1, max_len: 120}];
  bool is_active = 4;
}
message SaveProductRouteResponse {}

message SupplierResponseRule {
  string id = 1;
  string supplier_id = 2;
  // Lower runs first; the first match decides.
  int32 priority = 3;
  string pattern = 4;
  // SUCCESS | FAILED | PENDING
  string outcome = 5;
  // Named capture groups lifted out of a match, when the response carries them.
  string reference_group = 6;
  string cost_group = 7;
  string description = 8;
  bool is_active = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListResponseRulesRequest { string supplier_id = 1 [(buf.validate.field).string.uuid = true]; }
message ListResponseRulesResponse { repeated SupplierResponseRule rules = 1; }

message CreateResponseRuleRequest {
  string supplier_id = 1 [(buf.validate.field).string.uuid = true];
  int32 priority = 2 [(buf.validate.field).int32 = {gte: 1, lte: 1000}];
  string pattern = 3 [(buf.validate.field).string = {min_len: 1, max_len: 2000}];
  string outcome = 4 [(buf.validate.field).string = {in: ["SUCCESS", "FAILED", "PENDING"]}];
  string reference_group = 5 [(buf.validate.field).string.max_len = 40];
  string cost_group = 6 [(buf.validate.field).string.max_len = 40];
  string description = 7 [(buf.validate.field).string.max_len = 300];
}
message CreateResponseRuleResponse { SupplierResponseRule rule = 1; }

// Rules are deactivated rather than edited. Changing a pattern in place would
// silently change how past logs should have been read.
message SetResponseRuleActiveRequest {
  string rule_id = 1 [(buf.validate.field).string.uuid = true];
  bool is_active = 2;
}
message SetResponseRuleActiveResponse {}

message TestResponseRulesRequest {
  string supplier_id = 1 [(buf.validate.field).string.uuid = true];
  string sample_response = 2 [(buf.validate.field).string = {min_len: 1, max_len: 8000}];
}
message TestResponseRulesResponse {
  // SUCCESS | FAILED | PENDING | UNMATCHED
  string outcome = 1;
  // Which rule decided, empty when nothing matched.
  string matched_rule_id = 2;
  string reference = 3;
  int64 cost_idr = 4;
  // False when the response carries no cost. Distinct from a cost of zero,
  // which would look like a free product.
  bool cost_reported = 5;
  // Rules that could not be applied, with the reason. Normally empty — patterns
  // are validated when saved. Anything here is coverage quietly missing, which
  // is how a supplier drifts into producing nothing but UNMATCHED without
  // anyone realising the rules stopped working rather than the supplier
  // changing shape.
  repeated SkippedResponseRule skipped_rules = 6;
}

message SkippedResponseRule {
  string rule_id = 1;
  string reason = 2;
}

message SupplierLogEntry {
  string id = 1;
  string supplier_name = 2;
  string order_id = 3;
  // REQUEST | CALLBACK
  string direction = 4;
  string endpoint = 5;
  string request_body = 6;
  string response_body = 7;
  int32 http_status = 8;
  string outcome = 9;
  string supplier_reference = 10;
  int64 cost_idr = 11;
  string error = 12;
  google.protobuf.Timestamp created_at = 13;
}

message ListSupplierLogsRequest {
  // Narrows to responses no rule recognised — the queue that keeps the rules
  // honest, since each one is a supplier saying something unreadable.
  bool unmatched_only = 1;
  int32 limit = 2;
}
message ListSupplierLogsResponse { repeated SupplierLogEntry logs = 1; }

message PlatformTransaction {
  string order_id = 1;
  string receipt_number = 2;
  string operator_name = 3;
  string pilgrim_name = 4;
  string product_name = 5;
  string category = 6;
  int64 amount_idr = 7;
  // What the gateway reported as paid. Zero when nothing has been reported
  // yet, which is different from a payment of zero.
  int64 paid_amount_idr = 8;
  // What the operator still holds — nothing for an unpaid or refunded one.
  int64 net_paid_idr = 9;
  // PENDING | PAID | HELD | REFUNDED | EXPIRED | FAILED | CANCELLED
  string status = 10;
  string held_reason = 11;
  // The other half of the story: PENDING | SENT | DELIVERED | FAILED |
  // NEEDS_REVIEW, or empty for a product nobody supplies.
  string fulfilment_status = 12;
  string supplier_name = 13;
  string supplier_reference = 14;
  string fulfilment_error = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp paid_at = 17;
  string risk_level = 18;
  string risk_reason = 19;
}

message ListTransactionsRequest {
  // Narrows to what is actually costing somebody: a payment that did not match
  // its bill, a checkout flagged by velocity controls, or something paid for
  // that never arrived.
  bool needs_attention = 1;
  int32 limit = 2;
}
message ListTransactionsResponse { repeated PlatformTransaction transactions = 1; }

message PlatformAccount {
  string user_id = 1;
  string name = 2;
  string email = 3;
  bool email_verified = 4;
  bool two_factor_enabled = 5;
  bool is_platform_admin = 6;
  // Empty for an account belonging to no organisation — a jamaah signing in to
  // see their own schedule.
  string operator_name = 7;
  string org_role = 8;
  int32 active_sessions = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListAccountsRequest {
  string search = 1 [(buf.validate.field).string.max_len = 120];
  int32 limit = 2;
}
message ListAccountsResponse { repeated PlatformAccount accounts = 1; }

message GrantPlatformAdminRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  string note = 2 [(buf.validate.field).string.max_len = 300];
}
message GrantPlatformAdminResponse {}

message RevokePlatformAdminRequest { string user_id = 1 [(buf.validate.field).string.min_len = 1]; }
message RevokePlatformAdminResponse {}

message RevokeSessionsRequest { string user_id = 1 [(buf.validate.field).string.min_len = 1]; }
message RevokeSessionsResponse { int32 sessions_ended = 1; }

message KycRecordSummary {
  string id = 1;
  string operator_name = 2;
  string user_id = 3;
  // AGENT | PILGRIM
  string subject_type = 4;
  string subject_id = 5;
  string full_name = 6;
  // PENDING_REVIEW | VERIFIED | REJECTED
  string status = 7;
  // SELF | STAFF
  string source = 8;
  string verified_by = 9;
  google.protobuf.Timestamp verified_at = 10;
  string rejection_reason = 11;
  google.protobuf.Timestamp created_at = 12;
  // Deliberately absent from the summary: the identity numbers themselves.
  // A list that carries them turns one careless screenshot into a leak of
  // everybody on it.
}

message ListKycRecordsRequest {
  string status = 1 [(buf.validate.field).string = {in: ["", "PENDING_REVIEW", "VERIFIED", "REJECTED"]}];
  int32 limit = 2;
}
message ListKycRecordsResponse { repeated KycRecordSummary records = 1; }

message GetKycRecordRequest {
  string subject_type = 1 [(buf.validate.field).string = {in: ["AGENT", "PILGRIM"]}];
  string subject_id = 2 [(buf.validate.field).string.uuid = true];
}
message GetKycRecordResponse {
  KycRecordSummary summary = 1;
  // In the clear, and audit-logged on every read.
  string nik = 2;
  string npwp = 3;
  string address = 4;
  string place_of_birth = 5;
}

message SetKycStatusRequest {
  string record_id = 1 [(buf.validate.field).string.uuid = true];
  string status = 2 [(buf.validate.field).string = {in: ["VERIFIED", "REJECTED"]}];
  string reason = 3 [(buf.validate.field).string.max_len = 500];
}
message SetKycStatusResponse {}
