syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

service ProductService {
  rpc CreateProduct(CreateProductRequest) returns (Product);
  rpc GetProduct(GetProductRequest) returns (Product);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (Product);
  rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse);

  // ListProductPricing shows what each kind of buyer actually pays, built up
  // from the platform's base. Prices are computed on read and never stored:
  // a stored price is a copy that goes stale the moment any level beneath it
  // moves, and the two would then disagree with nobody able to say which is
  // authoritative.
  rpc ListProductPricing(ListProductPricingRequest) returns (ListProductPricingResponse);

  // SetProductMarkup sets this travel's markups for one product. The base is
  // deliberately not settable here — it is what TawafiqHub charges the travel,
  // and a travel that could edit it could sell below the platform's cost.
  rpc SetProductMarkup(SetProductMarkupRequest) returns (SetProductMarkupResponse);
}

// `category` is a plain string, not an enum, matching the rest of this
// service's status-like fields (movement.status, vehicle.status, agent.tier).
// Known values: TRAVEL_PACKAGE, EQUIPMENT, ROAMING_DATA, PPOB_CREDIT — see the
// CHECK constraint on products.category and service/product.go for validation.
// Only TRAVEL_PACKAGE uses `type` (HAJJ/UMRAH); the others leave it blank.
message Product {
  string id = 1;
  string operator_id = 2;
  string season_id = 3;
  string name = 4;
  string type = 5;
  int64 price_idr = 6;
  int32 duration_days = 7;
  string description = 8;
  repeated string inclusions = 9;
  bool is_active = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  string category = 13;
  // Split of price_idr on every order of this product — see §7:
  // Basis points, not fractions: 1500 = 15.00%. Integers, because the split
  // is computed as total * bps / 10000 and a floating-point multiplier
  // silently dropped a rupiah on roughly one order in two hundred.
  //
  // platform_margin_bps + operator_margin_bps + agent_margin_bps <= 10000,
  // validated on save (service/product.go), not just documented.
  // What a person quotes — "PULSA-TSEL-10K", not a UUID. Unique within an
  // operator, so two travels may both sell "PULSA-10K" without either needing
  // to know the other exists.
  string code = 29;
  // The face value the customer receives, for products that have one: pulsa of
  // 10,000 sold for 11,500. Zero means the product has no face value, which is
  // the case for a travel package — distinct from a face value of nothing.
  int64 nominal_idr = 30;
  reserved 14, 15, 16;
  reserved "platform_margin_pct", "operator_margin_pct", "agent_margin_pct";
  int32 platform_margin_bps = 26;
  int32 operator_margin_bps = 27;
  int32 agent_margin_bps = 28;
  // The three fields below only apply when category == TRAVEL_PACKAGE.
  repeated ItineraryDay itinerary_days = 17;
  repeated string hotel_ids = 18;
  // When set, an order for this product that reaches PAID auto-assigns
  // the buying pilgrim into this kloter (only if they don't already have
  // one — see OrderService's paid-order cascade).
  string default_kloter_id = 19;
}

message ItineraryDay {
  int32 day_number = 1;
  string title = 2;
  string city = 3;
  string activities = 4;
  bool meal_breakfast = 5;
  bool meal_lunch = 6;
  bool meal_dinner = 7;
}

message CreateProductRequest {
  string season_id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string type = 3;
  int64 price_idr = 4;
  int32 duration_days = 5;
  string description = 6;
  repeated string inclusions = 7;
  string category = 8 [(buf.validate.field).string.min_len = 1];
  string code = 23 [(buf.validate.field).string = {max_len: 40, pattern: "^[A-Za-z0-9._-]*$"}];
  int64 nominal_idr = 24 [(buf.validate.field).int64.gte = 0];
  reserved 9, 10, 11;
  reserved "platform_margin_pct", "operator_margin_pct", "agent_margin_pct";
  int32 platform_margin_bps = 20;
  int32 operator_margin_bps = 21;
  int32 agent_margin_bps = 22;
  repeated ItineraryDay itinerary_days = 12;
  repeated string hotel_ids = 13;
  string default_kloter_id = 14;
}

message GetProductRequest { string product_id = 1 [(buf.validate.field).string.min_len = 1]; }
message ListProductsRequest { string season_id = 1 [(buf.validate.field).string.min_len = 1]; }
message ListProductsResponse { repeated Product products = 1; }

message UpdateProductRequest {
  string product_id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string type = 3;
  int64 price_idr = 4;
  int32 duration_days = 5;
  string description = 6;
  repeated string inclusions = 7;
  bool is_active = 8;
  string category = 9 [(buf.validate.field).string.min_len = 1];
  string code = 23 [(buf.validate.field).string = {max_len: 40, pattern: "^[A-Za-z0-9._-]*$"}];
  int64 nominal_idr = 24 [(buf.validate.field).int64.gte = 0];
  reserved 10, 11, 12;
  reserved "platform_margin_pct", "operator_margin_pct", "agent_margin_pct";
  int32 platform_margin_bps = 20;
  int32 operator_margin_bps = 21;
  int32 agent_margin_bps = 22;
  repeated ItineraryDay itinerary_days = 13;
  repeated string hotel_ids = 14;
  string default_kloter_id = 15;
}

message DeleteProductRequest { string product_id = 1 [(buf.validate.field).string.min_len = 1]; }
message DeleteProductResponse {}

// ProductPricing is one product's price broken into the levels that make it,
// plus what each buyer pays. Sending both the parts and the totals is
// deliberate: the screen must be able to show why a price is what it is, and
// recomputing the sum in TypeScript would be a second implementation of the
// rule that decides what people are charged.
message ProductPricing {
  string product_id = 1;
  string product_name = 2;
  string code = 3;
  string category = 4;

  // The platform's base. base_price_set separates "not configured" from a
  // genuine zero — the first is a gap that blocks selling, the second would
  // mean free.
  int64 base_price_idr = 5;
  bool base_price_set = 6;

  int64 operator_markup_idr = 7;
  int64 agent_markup_idr = 8;

  // False when this travel has never saved markups for the product. Zero
  // markups and absent markups price identically, so the screen has to be able
  // to tell them apart and so does the sale.
  bool markup_configured = 9;

  // base + operator markup. What an agent pays buying on their own account,
  // which is why such a purchase earns no commission: the agent level is not
  // in it.
  int64 agent_price_idr = 10;

  // base + operator markup + agent markup. What a jamaah pays, whether or not
  // an agent referred them — a referred jamaah must never be quoted more than
  // a walk-in.
  int64 pilgrim_price_idr = 11;

  // True when the product cannot currently be sold, with reason carrying the
  // explanation. Computed here rather than inferred on the client, so the
  // screen and the checkout refuse for identical reasons.
  bool sellable = 12;
  string unsellable_reason = 13;
}

message ListProductPricingRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
}
message ListProductPricingResponse { repeated ProductPricing pricing = 1; }

message SetProductMarkupRequest {
  string product_id = 1 [(buf.validate.field).string.uuid = true];
  int64 operator_markup_idr = 2 [(buf.validate.field).int64.gte = 0];
  int64 agent_markup_idr = 3 [(buf.validate.field).int64.gte = 0];
}
message SetProductMarkupResponse { ProductPricing pricing = 1; }
