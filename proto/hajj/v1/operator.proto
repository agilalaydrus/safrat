syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

service OperatorService {
  rpc CreateOperator(CreateOperatorRequest) returns (Operator);
  rpc GetMyOperator(GetMyOperatorRequest) returns (Operator);
  rpc UpdateOperator(UpdateOperatorRequest) returns (Operator);
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);
  // Public preflight check used by onboarding before an operator chooses its
  // permanent tenant subdomain.
  rpc CheckOperatorSlug(CheckOperatorSlugRequest) returns (CheckOperatorSlugResponse);
  // Public — resolves a subdomain slug (e.g. "vacana" from vacana.tawafiqhub.id)
  // to the operator it belongs to, for apps/web/middleware.ts to rewrite
  // subdomain requests to the existing /register, /apply, /waitlist path-based
  // routes. Deliberately returns only id + name, nothing sensitive.
  rpc ResolveOperatorSlug(ResolveOperatorSlugRequest) returns (ResolveOperatorSlugResponse);

  // Updates the calling operator's public-profile fields (used by the
  // onboarding wizard's final step and the dashboard settings editor).
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (Operator);
  // Public — the operator's shareable landing page at {slug}.tawafiqhub.id.
  // The internal /p/{slug} route is only the rendering target. Returns
  // only non-sensitive fields plus available (not-yet-ended) seasons. In
  // publicProcedures (auth.go) and rateLimitedProcedures (ratelimit.go).
  rpc GetPublicProfile(GetPublicProfileRequest) returns (GetPublicProfileResponse);
  // Authenticated CMS endpoints. Draft writes never affect the public
  // storefront until PublishMyStorefront atomically copies the current draft
  // to the published snapshot.
  rpc GetMyStorefront(GetMyStorefrontRequest) returns (StorefrontEditor);
  rpc SaveMyStorefrontDraft(SaveMyStorefrontDraftRequest) returns (StorefrontEditor);
  rpc PublishMyStorefront(PublishMyStorefrontRequest) returns (StorefrontEditor);
  // Returns a short-lived, tenant-scoped PUT URL. The browser uploads the
  // already-compressed WebP directly to S3-compatible storage.
  rpc CreateStorefrontUpload(CreateStorefrontUploadRequest) returns (CreateStorefrontUploadResponse);
  rpc ConfirmStorefrontUpload(ConfirmStorefrontUploadRequest) returns (ConfirmStorefrontUploadResponse);
}

message Operator {
  string id = 1;
  string better_auth_org_id = 2;
  string name = 3;
  string country = 4;
  string email = 5;
  string license_number = 6;
  google.protobuf.Timestamp created_at = 7;
  string slug = 8;
  string logo_url = 9;
  string description = 10;
  string whatsapp_number = 11;
  string website = 12;
  string address = 13;
  string city = 14;
  bool is_profile_complete = 15;
  string brand_color = 16;
  string hero_eyebrow = 17;
  string hero_title = 18;
  string hero_subtitle = 19;
  string hero_image_url = 20;
}

message UpdateMyProfileRequest {
  string logo_url = 1;
  string description = 2 [(buf.validate.field).string.max_len = 500];
  string whatsapp_number = 3;
  string website = 4;
  string address = 5;
  string city = 6;
  // Empty preserves the current/default color for older clients.
  string brand_color = 7 [(buf.validate.field).string = {pattern: "^$|^#[0-9A-Fa-f]{6}$"}];
  string hero_eyebrow = 8 [(buf.validate.field).string.max_len = 80];
  string hero_title = 9 [(buf.validate.field).string.max_len = 120];
  string hero_subtitle = 10 [(buf.validate.field).string.max_len = 240];
  string hero_image_url = 11 [(buf.validate.field).string.max_len = 2048];
}

message GetPublicProfileRequest {
  string slug = 1 [(buf.validate.field).string.min_len = 1];
}

message PublicSeasonSummary {
  string id = 1;
  string name = 2;
  string type = 3;
  google.protobuf.Timestamp start_date = 4;
  google.protobuf.Timestamp end_date = 5;
  int32 pilgrim_count = 6;
  string slug = 7;
}

message GetPublicProfileResponse {
  string operator_id = 1;
  string name = 2;
  string slug = 3;
  string logo_url = 4;
  string description = 5;
  string whatsapp_number = 6;
  string website = 7;
  string address = 8;
  string city = 9;
  string license_number = 10;
  string country = 11;
  repeated PublicSeasonSummary active_seasons = 12;
  string brand_color = 13;
  string hero_eyebrow = 14;
  string hero_title = 15;
  string hero_subtitle = 16;
  string hero_image_url = 17;
  StorefrontContent content = 18;
}

message StorefrontContent {
  string display_name = 1 [(buf.validate.field).string.max_len = 120];
  string logo_url = 2 [(buf.validate.field).string.max_len = 2048];
  string description = 3 [(buf.validate.field).string.max_len = 1200];
  string whatsapp_number = 4 [(buf.validate.field).string.max_len = 40];
  string website = 5 [(buf.validate.field).string.max_len = 2048];
  string address = 6 [(buf.validate.field).string.max_len = 300];
  string city = 7 [(buf.validate.field).string.max_len = 120];
  string brand_color = 8 [(buf.validate.field).string = {pattern: "^$|^#[0-9A-Fa-f]{6}$"}];
  string hero_eyebrow = 9 [(buf.validate.field).string.max_len = 80];
  string hero_title = 10 [(buf.validate.field).string.max_len = 120];
  string hero_subtitle = 11 [(buf.validate.field).string.max_len = 240];
  string hero_image_url = 12 [(buf.validate.field).string.max_len = 2048];
  repeated StorefrontPackage packages = 13;
  repeated StorefrontGalleryItem gallery = 14;
  repeated StorefrontTestimonial testimonials = 15;
  repeated StorefrontFaq faqs = 16;
}

message StorefrontPackage {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
  string image_url = 2 [(buf.validate.field).string.max_len = 2048];
  string summary = 3 [(buf.validate.field).string.max_len = 300];
  string price_label = 4 [(buf.validate.field).string.max_len = 80];
  repeated string facilities = 5;
  repeated StorefrontItineraryItem itinerary = 6;
}

message StorefrontItineraryItem {
  string title = 1 [(buf.validate.field).string.max_len = 120];
  string description = 2 [(buf.validate.field).string.max_len = 300];
}

message StorefrontGalleryItem {
  string image_url = 1 [(buf.validate.field).string.max_len = 2048];
  string alt_text = 2 [(buf.validate.field).string.max_len = 160];
  string caption = 3 [(buf.validate.field).string.max_len = 160];
}

message StorefrontTestimonial {
  string quote = 1 [(buf.validate.field).string.max_len = 360];
  string name = 2 [(buf.validate.field).string.max_len = 100];
  string role = 3 [(buf.validate.field).string.max_len = 120];
}

message StorefrontFaq {
  string question = 1 [(buf.validate.field).string.max_len = 180];
  string answer = 2 [(buf.validate.field).string.max_len = 600];
}

message GetMyStorefrontRequest {}

message StorefrontEditor {
  StorefrontContent content = 1;
  repeated PublicSeasonSummary active_seasons = 2;
  int64 draft_revision = 3;
  int64 published_revision = 4;
  google.protobuf.Timestamp published_at = 5;
  string operator_name = 6;
  string operator_slug = 7;
  string license_number = 8;
  string country = 9;
}

message SaveMyStorefrontDraftRequest {
  StorefrontContent content = 1 [(buf.validate.field).required = true];
  int64 expected_revision = 2 [(buf.validate.field).int64.gte = 0];
}

message PublishMyStorefrontRequest {
  int64 expected_revision = 1 [(buf.validate.field).int64.gte = 0];
}

enum StorefrontAssetKind {
  STOREFRONT_ASSET_KIND_UNSPECIFIED = 0;
  STOREFRONT_ASSET_KIND_LOGO = 1;
  STOREFRONT_ASSET_KIND_HERO = 2;
  STOREFRONT_ASSET_KIND_GALLERY = 3;
  STOREFRONT_ASSET_KIND_PACKAGE = 4;
}

message CreateStorefrontUploadRequest {
  StorefrontAssetKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 size_bytes = 2 [(buf.validate.field).int64 = {gt: 0, lte: 5242880}];
}

message CreateStorefrontUploadResponse {
  string upload_url = 1;
  // Reserved for wire compatibility. The usable URL is returned only by
  // ConfirmStorefrontUpload after the uploaded object has been verified.
  string public_url = 2;
  string method = 3;
  string content_type = 4;
  google.protobuf.Timestamp expires_at = 5;
  string object_key = 6;
}

message ConfirmStorefrontUploadRequest {
  string object_key = 1 [(buf.validate.field).string = {min_len: 1, max_len: 300}];
}

message ConfirmStorefrontUploadResponse {
  string public_url = 1;
}

message CreateOperatorRequest {
  string better_auth_org_id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string country = 3;
  string email = 4 [(buf.validate.field).string.email = true];
  string license_number = 5;
  // User-selected tenant subdomain. Empty remains supported as a backwards-
  // compatible fallback and lets the API derive one from the operator name.
  string slug = 6;
}

message GetMyOperatorRequest {}

message UpdateOperatorRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string country = 2;
  string email = 3 [(buf.validate.field).string.email = true];
  string license_number = 4;
}

message AuditLog {
  string id = 1;
  string action = 2;
  string entity_id = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
  string entity_type = 6;
  string actor_name = 7;
}

message ListAuditLogsRequest { int32 limit = 1; }
message ListAuditLogsResponse { repeated AuditLog logs = 1; }

message CheckOperatorSlugRequest {
  string slug = 1 [(buf.validate.field).string = {min_len: 3, max_len: 63, pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"}];
}
message CheckOperatorSlugResponse { bool available = 1; }

message ResolveOperatorSlugRequest {
  string slug = 1 [(buf.validate.field).string.min_len = 1];
}
message ResolveOperatorSlugResponse {
  string operator_id = 1;
  string name = 2;
  // Empty when the operator has no active season — apps/web/middleware.ts
  // falls back to a "not found" response for /register and /waitlist
  // subdomain requests that don't specify a season explicitly.
  string active_season_id = 3;
}
