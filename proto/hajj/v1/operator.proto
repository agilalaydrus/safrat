syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

service OperatorService {
  rpc CreateOperator(CreateOperatorRequest) returns (Operator);
  rpc GetMyOperator(GetMyOperatorRequest) returns (Operator);
  rpc UpdateOperator(UpdateOperatorRequest) returns (Operator);
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);
  // Public — resolves a subdomain slug (e.g. "vacana" from vacana.tawafiqhub.id)
  // to the operator it belongs to, for apps/web/middleware.ts to rewrite
  // subdomain requests to the existing /register, /apply, /waitlist path-based
  // routes. Deliberately returns only id + name, nothing sensitive.
  rpc ResolveOperatorSlug(ResolveOperatorSlugRequest) returns (ResolveOperatorSlugResponse);
}

message Operator {
  string id = 1;
  string better_auth_org_id = 2;
  string name = 3;
  string country = 4;
  string email = 5;
  string license_number = 6;
  google.protobuf.Timestamp created_at = 7;
  string slug = 8;
}

message CreateOperatorRequest {
  string better_auth_org_id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string country = 3;
  string email = 4 [(buf.validate.field).string.email = true];
  string license_number = 5;
}

message GetMyOperatorRequest {}

message UpdateOperatorRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string country = 2;
  string email = 3 [(buf.validate.field).string.email = true];
  string license_number = 4;
}

message AuditLog {
  string id = 1;
  string action = 2;
  string entity_id = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
  string entity_type = 6;
  string actor_name = 7;
}

message ListAuditLogsRequest { int32 limit = 1; }
message ListAuditLogsResponse { repeated AuditLog logs = 1; }

message ResolveOperatorSlugRequest {
  string slug = 1 [(buf.validate.field).string.min_len = 1];
}
message ResolveOperatorSlugResponse {
  string operator_id = 1;
  string name = 2;
  // Empty when the operator has no active season — apps/web/middleware.ts
  // falls back to a "not found" response for /register and /waitlist
  // subdomain requests that don't specify a season explicitly.
  string active_season_id = 3;
}
