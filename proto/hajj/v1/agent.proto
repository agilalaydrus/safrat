syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

service AgentService {
  rpc CreateAgent(CreateAgentRequest) returns (Agent);
  rpc GetAgent(GetAgentRequest) returns (Agent);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // ListAgentPayouts is the money-owed counterpart to ListAgents' referral
  // count — how much commission each agent has actually earned from orders
  // that have been paid, not just how many pilgrims they referred.
  rpc ListAgentPayouts(ListAgentPayoutsRequest) returns (ListAgentPayoutsResponse);
  // RecordAgentPayout appends a disbursement to the ledger — it never
  // overwrites or "marks paid" in place, so a partial/installment payout
  // history stays intact and auditable.
  rpc RecordAgentPayout(RecordAgentPayoutRequest) returns (AgentPayout);
  // ListAgentPayoutHistory is the ledger behind a single agent's numbers in
  // ListAgentPayouts — every individual disbursement, for the operator to
  // review before recording another one.
  rpc ListAgentPayoutHistory(ListAgentPayoutHistoryRequest) returns (ListAgentPayoutHistoryResponse);
  rpc UpdateAgent(UpdateAgentRequest) returns (Agent);
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);
  // ApplyAsAgent is the one public, unauthenticated RPC on this service — see
  // middleware.NewAuthInterceptor's public-procedure allowlist.
  rpc ApplyAsAgent(ApplyAsAgentRequest) returns (Agent);

  // --- Self-service wallet (Leader/Agent side) ---
  // Every Group Leader is also an Agent (middleware.EnsureAgentForLeader),
  // so these resolve "which agent" from the caller's own Better Auth
  // identity, not a request param — an agent can only ever see/manage their
  // own wallet. Authenticated like any other RPC (not public); no
  // publicProcedures/rateLimitedProcedures entry needed.
  rpc GetMyWallet(GetMyWalletRequest) returns (AgentWallet);
  // RequestAgentPayout queues a withdrawal for operator review — it never
  // moves money itself. This is deliberately the seam where a future
  // payment-gateway disbursement (Xendit) would plug in: today an operator
  // approves manually via RecordAgentPayout(request_id=...); later,
  // approval could trigger an automatic disbursement call instead, without
  // changing anything on the request side.
  rpc RequestAgentPayout(RequestAgentPayoutRequest) returns (PayoutRequest);

  // --- Withdrawal request queue (Operator side) ---
  rpc ListPayoutRequests(ListPayoutRequestsRequest) returns (ListPayoutRequestsResponse);
  rpc RejectPayoutRequest(RejectPayoutRequestRequest) returns (PayoutRequest);

  // ListMyPilgrims is the Tour Leader portal's referral list — every
  // pilgrim with pilgrims.agent_id = this caller's own agent record,
  // across every season. Resolves "which agent" from the caller's own
  // Better Auth identity, same as GetMyWallet — never trusts an agent_id
  // from the request.
  rpc ListMyPilgrims(ListMyPilgrimsRequest) returns (ListMyPilgrimsResponse);
  // ListMyReferredTransactions is the money view of that same referral list:
  // what each referred jamaah actually transacted, what is still held after
  // refunds, and the commission it produced. Self-scoped from the Better Auth
  // identity like GetMyWallet — an agent can only ever see their own referrals.
  rpc ListMyReferredTransactions(ListMyReferredTransactionsRequest) returns (ListMyReferredTransactionsResponse);

  // --- KYC ---
  // UpdateAgentKyc/VerifyAgentKyc are admin-facing (operator dashboard).
  rpc UpdateAgentKyc(UpdateAgentKycRequest) returns (Agent);
  rpc VerifyAgentKyc(VerifyAgentKycRequest) returns (Agent);
  // SubmitMyAgentKyc is self-service, same "resolve from caller identity"
  // pattern as GetMyWallet — works for both a real Agent and a Muttawwif
  // (every leader has an agent row via EnsureAgentForLeader).
  rpc SubmitMyAgentKyc(SubmitMyAgentKycRequest) returns (Agent);
  rpc GetMyAgentKyc(GetMyAgentKycRequest) returns (Agent);
  rpc ListAgentDocuments(ListAgentDocumentsRequest) returns (ListAgentDocumentsResponse);
  rpc ListMyAgentDocuments(ListMyAgentDocumentsRequest) returns (ListAgentDocumentsResponse);
}

message Agent {
  string id = 1;
  string operator_id = 2;
  string name = 3;
  string phone = 4;
  string email = 5;
  double commission_rate = 6;
  string notes = 7;
  bool is_active = 8;
  int32 pilgrim_count = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  string referral_code = 12;
  string tier = 13;
  string referred_by_agent_id = 14;
  // KYC (Know Your Customer) — also covers Muttawwif (Group Leader), since
  // every leader has an agent row via EnsureAgentForLeader. NPWP/bank
  // fields exist for commission-payout compliance; a Muttawwif with no
  // payout flow simply leaves them blank.
  string nik = 15;
  string npwp = 16;
  string address = 17;
  google.protobuf.Timestamp date_of_birth = 18;
  string passport_number = 19;
  google.protobuf.Timestamp passport_expiry_date = 20;
  string bank_name = 21;
  string bank_account_number = 22;
  string bank_account_holder = 23;
  string kyc_status = 24; // UNVERIFIED | PENDING_REVIEW | VERIFIED | REJECTED
  string kyc_source = 25; // ADMIN | SELF
  string kyc_verified_by = 26;
  google.protobuf.Timestamp kyc_verified_at = 27;
  string kyc_rejection_reason = 28;
}

message ApplyAsAgentRequest {
  string operator_id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string phone = 3;
  string email = 4;
  string referred_by_code = 5;
}

message CreateAgentRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string phone = 2;
  string email = 3;
  double commission_rate = 4;
  string notes = 5;
}

message GetAgentRequest { string agent_id = 1 [(buf.validate.field).string.min_len = 1]; }
message ListAgentsRequest {}
message ListAgentsResponse { repeated Agent agents = 1; }

message AgentPayout {
  string agent_id = 1;
  string agent_name = 2;
  // Sum of orders.agent_commission_idr across this agent's PAID orders —
  // what's actually owed, not a projection off commission_rate.
  int64 total_commission_idr = 3;
  int32 paid_order_count = 4;
  // Sum of the agent_payouts ledger — what's actually been disbursed.
  int64 total_disbursed_idr = 5;
  // total_commission_idr - total_disbursed_idr.
  int64 outstanding_idr = 6;
}

message ListAgentPayoutsRequest {}
message ListAgentPayoutsResponse { repeated AgentPayout payouts = 1; }

message UpdateAgentKycRequest {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  string nik = 2 [(buf.validate.field).string.max_len = 32];
  string npwp = 3 [(buf.validate.field).string.max_len = 32];
  string address = 4 [(buf.validate.field).string.max_len = 300];
  google.protobuf.Timestamp date_of_birth = 5;
  string passport_number = 6 [(buf.validate.field).string.max_len = 20];
  google.protobuf.Timestamp passport_expiry_date = 7;
  string bank_name = 8 [(buf.validate.field).string.max_len = 100];
  string bank_account_number = 9 [(buf.validate.field).string.max_len = 40];
  string bank_account_holder = 10 [(buf.validate.field).string.max_len = 100];
}

message VerifyAgentKycRequest {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  bool approve = 2;
  string rejection_reason = 3 [(buf.validate.field).string.max_len = 300];
}

message SubmitMyAgentKycRequest {
  string nik = 1 [(buf.validate.field).string.max_len = 32];
  string npwp = 2 [(buf.validate.field).string.max_len = 32];
  string address = 3 [(buf.validate.field).string.max_len = 300];
  google.protobuf.Timestamp date_of_birth = 4;
  string passport_number = 5 [(buf.validate.field).string.max_len = 20];
  google.protobuf.Timestamp passport_expiry_date = 6;
  string bank_name = 7 [(buf.validate.field).string.max_len = 100];
  string bank_account_number = 8 [(buf.validate.field).string.max_len = 40];
  string bank_account_holder = 9 [(buf.validate.field).string.max_len = 100];
}

message GetMyAgentKycRequest {}

message AgentDocument {
  string id = 1;
  string agent_id = 2;
  string doc_type = 3; // KTP | PASSPORT | SELFIE | NPWP | BANK_BOOK | OTHER
  string file_url = 4;
  string file_name = 5;
  string uploaded_by = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListAgentDocumentsRequest {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListAgentDocumentsResponse {
  repeated AgentDocument documents = 1;
}

message ListMyAgentDocumentsRequest {}

enum PayoutMethod {
  PAYOUT_METHOD_UNSPECIFIED = 0;
  PAYOUT_METHOD_TRANSFER = 1;
  PAYOUT_METHOD_CASH = 2;
  PAYOUT_METHOD_EWALLET = 3;
}

message RecordAgentPayoutRequest {
  string agent_id = 1 [(buf.validate.field).string.uuid = true];
  int64 amount_idr = 2 [(buf.validate.field).int64.gt = 0];
  string note = 3;
  PayoutMethod method = 4 [(buf.validate.field).enum = {defined_only: true, in: [1, 2, 3]}];
  // Set when this payout settles a leader-initiated withdrawal request
  // (RequestAgentPayout) — closes the request as APPROVED and links it to
  // the ledger entry this call creates. Empty for an ad-hoc payout the
  // operator initiates without a prior request.
  string request_id = 5;
}

message AgentPayoutEntry {
  string id = 1;
  int64 amount_idr = 2;
  string note = 3;
  PayoutMethod method = 4;
  string paid_by_name = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListAgentPayoutHistoryRequest {
  string agent_id = 1 [(buf.validate.field).string.uuid = true];
}
message ListAgentPayoutHistoryResponse { repeated AgentPayoutEntry entries = 1; }

message UpdateAgentRequest {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string phone = 3;
  string email = 4;
  double commission_rate = 5;
  string notes = 6;
  bool is_active = 7;
}

message DeleteAgentRequest { string agent_id = 1 [(buf.validate.field).string.min_len = 1]; }
message DeleteAgentResponse {}

enum WalletTransactionType {
  WALLET_TRANSACTION_TYPE_UNSPECIFIED = 0;
  // Commission earned from a PAID order.
  WALLET_TRANSACTION_TYPE_CREDIT = 1;
  // Commission actually disbursed (RecordAgentPayout).
  WALLET_TRANSACTION_TYPE_DEBIT = 2;
  // A withdrawal request awaiting operator review — shown so the agent
  // knows that portion of their balance is already spoken for, not
  // double-countable toward another request.
  WALLET_TRANSACTION_TYPE_PENDING_REQUEST = 3;
  // Commission clawed back because the sale was refunded. Shown explicitly:
  // without it the earning simply vanishes from the list while the balance
  // drops, and the agent has no way to tell what happened.
  WALLET_TRANSACTION_TYPE_REVERSAL = 4;
  // A manual correction recorded by the operator.
  WALLET_TRANSACTION_TYPE_ADJUSTMENT = 5;
}

message WalletTransaction {
  string id = 1;
  WalletTransactionType type = 2;
  int64 amount_idr = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
}

message AgentWallet {
  string agent_id = 1;
  string agent_name = 2;
  // Lifetime commission earned, net of reversals — read from the commission
  // ledger, so a refund is reflected here and visible in transactions.
  int64 total_earned_idr = 3;
  // Lifetime amount actually disbursed.
  int64 total_withdrawn_idr = 4;
  // total_earned_idr - total_withdrawn_idr — everything owed, including
  // amounts already tied up in a pending request.
  int64 balance_idr = 5;
  // Sum of this agent's own PENDING requests.
  int64 pending_requested_idr = 6;
  // balance_idr - pending_requested_idr — the actual most a new request can
  // ask for.
  int64 available_idr = 7;
  repeated WalletTransaction transactions = 8;
}

message GetMyWalletRequest {}

enum PayoutRequestStatus {
  PAYOUT_REQUEST_STATUS_UNSPECIFIED = 0;
  PAYOUT_REQUEST_STATUS_PENDING = 1;
  PAYOUT_REQUEST_STATUS_APPROVED = 2;
  PAYOUT_REQUEST_STATUS_REJECTED = 3;
}

message PayoutRequest {
  string id = 1;
  string agent_id = 2;
  string agent_name = 3;
  int64 amount_idr = 4;
  string note = 5;
  PayoutRequestStatus status = 6;
  google.protobuf.Timestamp requested_at = 7;
  google.protobuf.Timestamp resolved_at = 8;
  string resolution_note = 9;
}

message RequestAgentPayoutRequest {
  int64 amount_idr = 1 [(buf.validate.field).int64.gt = 0];
  string note = 2;
}

message ListPayoutRequestsRequest {
  // Empty = every PENDING request across the operator, for a requests
  // inbox. Set to scope to one agent (e.g. inside AgentPayoutDialog).
  string agent_id = 1;
}
message ListPayoutRequestsResponse { repeated PayoutRequest requests = 1; }

message RejectPayoutRequestRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string note = 2 [(buf.validate.field).string.min_len = 1];
}

message AgentPilgrim {
  string id = 1;
  string full_name = 2;
  string passport_number = 3;
  string gender = 4;
  string payment_status = 5;
  bool docs_complete = 6;
  string pilgrim_status = 7;
  string season_name = 8;
  google.protobuf.Timestamp departure_date = 9;
  string season_id = 10;
}

// One referred jamaah's transaction recap. Amounts are net: a refunded order
// contributes nothing to either the total paid or the commission, because
// neither survived the refund.
message ReferredCustomerRecap {
  string pilgrim_id = 1;
  string pilgrim_name = 2;
  int32 order_count = 3;
  int32 refunded_order_count = 4;
  int64 total_paid_idr = 5;
  int64 refunded_idr = 6;
  int64 commission_idr = 7;
  google.protobuf.Timestamp last_transaction_at = 8;
}

message ListMyReferredTransactionsRequest {}
message ListMyReferredTransactionsResponse {
  repeated ReferredCustomerRecap customers = 1;
  int64 total_paid_idr = 2;
  int64 total_refunded_idr = 3;
  int64 total_commission_idr = 4;
}

message ListMyPilgrimsRequest {}
message ListMyPilgrimsResponse { repeated AgentPilgrim pilgrims = 1; }
