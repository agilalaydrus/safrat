syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

// Module 7: Digital Products & Orders. CreateOrder is public — a pilgrim
// checks out from their own PWA, authenticated by app_access_code the same
// way as every other PilgrimAppService call, not a Better Auth session (see
// publicProcedures in internal/middleware/auth.go). ListOrders/GetOrder are
// the normal authenticated/org-scoped lane, for the admin dashboard.
service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  // CreateManualOrder is the admin-side counterpart — operator staff
  // selling a digital product in person or over the phone/WhatsApp, on
  // behalf of a pilgrim who isn't checking out themselves. Authenticated
  // (Better Auth session + org membership), unlike CreateOrder.
  rpc CreateManualOrder(CreateManualOrderRequest) returns (CreateOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetOrder(GetOrderRequest) returns (Order);
  // RefundOrder records that money went back to the pilgrim. Manual and
  // operator-driven on purpose: it credits the pilgrim's balance ledger and
  // reverses the agent's commission, but it does not itself move money at the
  // gateway.
  //
  // A refund is always the whole transaction — never part of it. The order
  // becomes REFUNDED, the pilgrim is credited what they paid, and the agent's
  // commission is reversed in full.
  rpc RefundOrder(RefundOrderRequest) returns (RefundOrderResponse);
  rpc ListOrderRefunds(ListOrderRefundsRequest) returns (ListOrderRefundsResponse);
  // CreateOrderForPilgrim lets an agent or Muttawwif transact on behalf of any
  // jamaah of their operator — the same sale staff can already make, without
  // having to ask staff to make it.
  //
  // Selling is open; earning is not. The commission always follows the
  // jamaah's referral, never the seller, so placing an order for somebody
  // else's referral credits that referrer and not the person who sold it.
  // Whoever placed it is recorded separately as placed_by_agent_id. That
  // separation is what keeps the referral system intact while leaving anyone
  // free to transact.
  rpc CreateOrderForPilgrim(CreateOrderForPilgrimRequest) returns (CreateOrderResponse);
  // Lists the products this signed-in agent/Muttawwif may buy, quoted at the
  // agent price (platform base + operator markup). Unconfigured products are
  // omitted rather than shown at a misleading legacy price.
  rpc ListMyPurchaseCatalogue(ListMyPurchaseCatalogueRequest) returns (ListMyPurchaseCatalogueResponse);
  // Creates a purchase for the signed-in agent/Muttawwif's own account. The
  // buyer identity is always derived from the session; no agent id is accepted
  // from the caller. Self-purchases never earn referral commission.
  rpc CreateOrderForSelf(CreateOrderForSelfRequest) returns (CreateOrderResponse);
  // The signed-in buyer's own order history, including pending and failed
  // attempts. This is separate from the referral recap: buying and earning
  // commission are deliberately different ledgers.
  rpc ListMyOrders(ListMyOrdersRequest) returns (ListOrdersResponse);
  // ResolveHeldOrder closes out a transaction whose payment did not match the
  // bill. Without it a held transaction is a dead end needing database access.
  rpc ResolveHeldOrder(ResolveHeldOrderRequest) returns (Order);

  // ChangeOrderProduct is "pindah paket": a pilgrim who already paid moves to
  // a different package. The old order is never rewritten to look like the
  // new one — its price columns come to describe the package the pilgrim is
  // actually on now, and a separate change record keeps the old numbers from
  // being lost. If the new package cost less than what was already paid, the
  // difference becomes an open credit rather than vanishing.
  rpc ChangeOrderProduct(ChangeOrderProductRequest) returns (ChangeOrderProductResponse);
  // ListOrdersForPilgrim finds the order "pindah paket" moves, and doubles as
  // a pilgrim's purchase history on their profile screen.
  rpc ListOrdersForPilgrim(ListOrdersForPilgrimRequest) returns (ListOrdersResponse);
  // ListPlanChanges is the history behind one pilgrim's current package.
  rpc ListPlanChanges(ListPlanChangesRequest) returns (ListPlanChangesResponse);

  // Kelebihan Bayar — the credit a pilgrim is owed, most often from a plan
  // change, and what happens to it. Resolving one is bookkeeping, not a
  // payment: it does not move money or touch another order's own numbers, it
  // records where the credit went so it can be found later.
  rpc ListPilgrimCredits(ListPilgrimCreditsRequest) returns (ListPilgrimCreditsResponse);
  rpc ResolvePilgrimCredit(ResolvePilgrimCreditRequest) returns (ResolvePilgrimCreditResponse);
}

message ChangeOrderProductRequest {
  string order_id = 1 [(buf.validate.field).string.min_len = 1];
  string to_product_id = 2 [(buf.validate.field).string.min_len = 1];
  // Empty keeps the order's current tier (or no tier, for a product without
  // them). QUAD | TRIPLE | DOUBLE otherwise.
  string to_room_tier = 3;
  string reason = 4 [(buf.validate.field).string = {min_len: 10, max_len: 500}];
  string idempotency_key = 5 [(buf.validate.field).string = {min_len: 8, max_len: 128}];
}

message ListOrdersForPilgrimRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ChangeOrderProductResponse {
  Order order = 1;
  int64 overpayment_idr = 2;
  int64 shortfall_idr = 3;
  // Set only when overpayment_idr > 0 — the credit that was opened for it.
  string credit_id = 4;
}

message ListPlanChangesRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 limit = 2;
}

message PlanChangeRow {
  string id = 1;
  string pilgrim_id = 2;
  string pilgrim_name = 3;
  string order_id = 4;
  string from_product_name = 5;
  string to_product_name = 6;
  int64 old_total_idr = 7;
  int64 new_total_idr = 8;
  int64 overpayment_idr = 9;
  int64 shortfall_idr = 10;
  string reason = 11;
  string changed_by = 12;
  google.protobuf.Timestamp created_at = 13;
}

message ListPlanChangesResponse { repeated PlanChangeRow changes = 1; }

message ListPilgrimCreditsRequest {
  bool only_open = 1;
  int32 limit = 2;
  // Empty means every pilgrim — the operator-wide queue.
  string pilgrim_id = 3;
}

message PilgrimCreditRow {
  string id = 1;
  string pilgrim_id = 2;
  string pilgrim_name = 3;
  int64 amount_idr = 4;
  // PLAN_CHANGE | MANUAL
  string source = 5;
  string reason = 6;
  // OPEN | APPLIED | REFUNDED
  string status = 7;
  string applied_to_order_id = 8;
  string applied_note = 9;
  string resolved_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp resolved_at = 12;
}

message ListPilgrimCreditsResponse { repeated PilgrimCreditRow credits = 1; }

message ResolvePilgrimCreditRequest {
  string credit_id = 1 [(buf.validate.field).string.min_len = 1];
  // APPLIED | REFUNDED
  string status = 2 [(buf.validate.field).string = {in: ["APPLIED", "REFUNDED"]}];
  // Required when status is APPLIED — which order the credit went toward.
  string applied_to_order_id = 3;
  string note = 4 [(buf.validate.field).string = {max_len: 500}];
}

message ResolvePilgrimCreditResponse {}

// Data portability — UU PDP, not a sales feature. An operator gets everything
// TawafiqHub holds about their own business as one file they can keep,
// without waiting on a support ticket.
service DataExportService {
  rpc RequestDataExport(RequestDataExportRequest) returns (DataExportRow);
  rpc ListDataExports(ListDataExportsRequest) returns (ListDataExportsResponse);
  // GetDataExportDownloadUrl mints a time-limited link, generated on request
  // rather than stored — a link that works forever is a link that outlives
  // the reason it was issued.
  rpc GetDataExportDownloadUrl(GetDataExportDownloadUrlRequest) returns (GetDataExportDownloadUrlResponse);
}

message RequestDataExportRequest {
  string idempotency_key = 1 [(buf.validate.field).string = {min_len: 8, max_len: 128}];
}

message DataExportRow {
  string id = 1;
  // PENDING | PROCESSING | READY | FAILED
  string status = 2;
  int64 size_bytes = 3;
  string error = 4;
  google.protobuf.Timestamp requested_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  google.protobuf.Timestamp expires_at = 7;
}

message ListDataExportsRequest {
  int32 limit = 1;
}
message ListDataExportsResponse { repeated DataExportRow exports = 1; }

message GetDataExportDownloadUrlRequest {
  string export_id = 1 [(buf.validate.field).string.min_len = 1];
}
message GetDataExportDownloadUrlResponse {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message Order {
  string id = 1;
  string operator_id = 2;
  string season_id = 3;
  string pilgrim_id = 4;
  string pilgrim_name = 5;
  string product_id = 6;
  string product_name = 7;
  string agent_id = 8;
  string agent_name = 9;
  int32 quantity = 10;
  int64 unit_price_idr = 11;
  int64 total_price_idr = 12;
  int64 platform_amount_idr = 13;
  int64 operator_amount_idr = 14;
  int64 agent_commission_idr = 15;
  // PENDING | PAID | HELD | EXPIRED | FAILED | CANCELLED | REFUNDED
  string status = 16;
  string checkout_url = 17;
  google.protobuf.Timestamp paid_at = 18;
  google.protobuf.Timestamp created_at = 19;
  // Who placed the order, when it was not the jamaah themselves. Distinct from
  // agent_id, which is the referrer who earns the commission.
  string placed_by_agent_id = 20;
  // What the gateway reported as actually paid, and why the transaction is
  // held if it is. Both empty until a payment notification arrives.
  int64 paid_amount_idr = 22;
  string held_reason = 23;
  string receipt_number = 24;
  string buyer_agent_id = 25;
  // PILGRIM | AGENT
  string buyer_kind = 26;
  string buyer_name = 27;
  int64 base_price_idr = 28;
  int64 operator_markup_idr = 29;
  int64 agent_markup_idr = 30;
  // The phone/account number supplied to the provider. Frozen on the
  // transaction so later profile edits cannot rewrite what was purchased.
  string destination = 31;
  // NORMAL | REVIEW. REVIEW is assigned by database-enforced checkout
  // velocity rules and means a matching gateway payment must enter HELD.
  string risk_level = 32;
  // Human-readable evidence for staff; empty for NORMAL transactions.
  string risk_reason = 33;
}

message CreateOrderRequest {
  string app_access_code = 1 [(buf.validate.field).string.min_len = 1];
  string product_id = 2 [(buf.validate.field).string.min_len = 1];
  int32 quantity = 3 [(buf.validate.field).int32 = {gte: 1, lte: 20}];
  // Required: without it a double-tapped checkout button made two orders and
  // two invoices, and the jamaah could pay both. The same key always settles
  // the same order and returns its existing payment link.
  string idempotency_key = 4 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message CreateOrderResponse {
  Order order = 1;
  // Xendit's hosted invoice page — the frontend redirects here to
  // complete payment. Empty if Xendit isn't configured (XENDIT_SECRET_KEY
  // unset), or if the order was created already-PAID (CreateManualOrder
  // with a CASH/BANK_TRANSFER method); see internal/payment/xendit.go.
  string checkout_url = 2;
}

enum ManualOrderPaymentMethod {
  MANUAL_ORDER_PAYMENT_METHOD_UNSPECIFIED = 0;
  // Generates a Xendit invoice link the operator shares with the pilgrim
  // (WhatsApp, etc.) — order stays PENDING until the webhook confirms it,
  // exactly like the pilgrim's own self-checkout.
  MANUAL_ORDER_PAYMENT_METHOD_XENDIT_LINK = 1;
  // Operator attests payment was already received outside Xendit — the
  // order is created already PAID. Always audit-logged (see
  // OrderService.CreateManualOrder); there is no gateway confirmation
  // backing these two, so the log is the only accountability trail.
  MANUAL_ORDER_PAYMENT_METHOD_CASH = 2;
  MANUAL_ORDER_PAYMENT_METHOD_BANK_TRANSFER = 3;
}

message CreateManualOrderRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
  string product_id = 2 [(buf.validate.field).string.uuid = true];
  int32 quantity = 3 [(buf.validate.field).int32 = {gte: 1, lte: 20}];
  ManualOrderPaymentMethod payment_method = 4 [(buf.validate.field).enum = {defined_only: true, in: [1, 2, 3]}];
  string note = 5 [(buf.validate.field).string.max_len = 500];
  string idempotency_key = 6 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message CreateOrderForPilgrimRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
  string product_id = 2 [(buf.validate.field).string.uuid = true];
  int32 quantity = 3 [(buf.validate.field).int32 = {gte: 1, lte: 20}];
  string idempotency_key = 4 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message PurchaseCatalogueProduct {
  string id = 1;
  string season_id = 2;
  string name = 3;
  string category = 4;
  string description = 5;
  string code = 6;
  int64 nominal_idr = 7;
  int64 unit_price_idr = 8;
}

message ListMyPurchaseCatalogueRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListMyPurchaseCatalogueResponse {
  repeated PurchaseCatalogueProduct products = 1;
}

message CreateOrderForSelfRequest {
  string product_id = 1 [(buf.validate.field).string.uuid = true];
  int32 quantity = 2 [(buf.validate.field).int32 = {gte: 1, lte: 20}];
  string destination = 3 [(buf.validate.field).string = {min_len: 3, max_len: 100}];
  string idempotency_key = 4 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message ListMyOrdersRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2;
  int32 offset = 3;
}

enum HeldOrderResolution {
  HELD_ORDER_RESOLUTION_UNSPECIFIED = 0;
  // The operator attests the difference was settled another way — cash handed
  // over at the counter, a top-up transfer, or a shortfall they chose to
  // waive. The transaction stands in full, so the commission stands too.
  // There is no gateway confirmation behind this, which is why it is always
  // audit-logged with who decided it and the discrepancy they accepted.
  HELD_ORDER_RESOLUTION_ACCEPT = 1;
  // The transaction is abandoned and the money returned outside the system.
  // Commission recognised when the order was placed is reversed.
  HELD_ORDER_RESOLUTION_REJECT = 2;
}

message ResolveHeldOrderRequest {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
  HeldOrderResolution resolution = 2 [(buf.validate.field).enum = {defined_only: true, in: [1, 2]}];
  string note = 3 [(buf.validate.field).string.max_len = 500];
}

message ListOrdersRequest {
  string season_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 limit = 2;
  int32 offset = 3;
}
message ListOrdersResponse {
  repeated Order orders = 1;
  int64 total_count = 2;
}

message OrderRefund {
  string id = 1;
  string order_id = 2;
  // Always the order's full total; a refund is never partial.
  int64 amount_idr = 3;
  // How much agent commission this refund clawed back — commission is earned
  // only on sales that stand, so this is the whole commission.
  int64 commission_reversed_idr = 4;
  string reason = 5;
  string created_by_user_id = 6;
  google.protobuf.Timestamp created_at = 7;
}

message RefundOrderRequest {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
  // No amount. A refund always returns the whole transaction, so a partial one
  // is not something this request can express — the rule is enforced by the
  // shape of the message rather than by a check someone could route around.
  reserved 2;
  reserved "amount_idr";
  string reason = 3 [(buf.validate.field).string.max_len = 500];
  // Required, not optional: a refund is money leaving, and a retried or
  // double-clicked request must settle the same refund rather than issue a
  // second one. The same key always refers to the same refund.
  string idempotency_key = 4 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message RefundOrderResponse {
  Order order = 1;
  OrderRefund refund = 2;
  // The pilgrim's balance after this refund, so the caller does not have to
  // ask separately for the number it just changed.
  int64 pilgrim_balance_idr = 3;
  // False when this request was a replay and the refund already existed.
  bool created = 4;
}

message ListOrderRefundsRequest { string order_id = 1 [(buf.validate.field).string.uuid = true]; }
message ListOrderRefundsResponse {
  // At most one, since an order can only be refunded once and only in full.
  repeated OrderRefund refunds = 1;
  int64 total_refunded_idr = 2;
}

message GetOrderRequest { string order_id = 1 [(buf.validate.field).string.min_len = 1]; }
