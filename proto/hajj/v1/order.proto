syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

// Module 7: Digital Products & Orders. CreateOrder is public — a pilgrim
// checks out from their own PWA, authenticated by app_access_code the same
// way as every other PilgrimAppService call, not a Better Auth session (see
// publicProcedures in internal/middleware/auth.go). ListOrders/GetOrder are
// the normal authenticated/org-scoped lane, for the admin dashboard.
service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  // CreateManualOrder is the admin-side counterpart — operator staff
  // selling a digital product in person or over the phone/WhatsApp, on
  // behalf of a pilgrim who isn't checking out themselves. Authenticated
  // (Better Auth session + org membership), unlike CreateOrder.
  rpc CreateManualOrder(CreateManualOrderRequest) returns (CreateOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetOrder(GetOrderRequest) returns (Order);
  // RefundOrder records that money went back to the pilgrim. Manual and
  // operator-driven on purpose: it credits the pilgrim's balance ledger and
  // reverses the agent's commission, but it does not itself move money at the
  // gateway.
  //
  // A refund is always the whole transaction — never part of it. The order
  // becomes REFUNDED, the pilgrim is credited what they paid, and the agent's
  // commission is reversed in full.
  rpc RefundOrder(RefundOrderRequest) returns (RefundOrderResponse);
  rpc ListOrderRefunds(ListOrderRefundsRequest) returns (ListOrderRefundsResponse);
  // CreateOrderForPilgrim lets an agent or Muttawwif transact on behalf of any
  // jamaah of their operator — the same sale staff can already make, without
  // having to ask staff to make it.
  //
  // Selling is open; earning is not. The commission always follows the
  // jamaah's referral, never the seller, so placing an order for somebody
  // else's referral credits that referrer and not the person who sold it.
  // Whoever placed it is recorded separately as placed_by_agent_id. That
  // separation is what keeps the referral system intact while leaving anyone
  // free to transact.
  rpc CreateOrderForPilgrim(CreateOrderForPilgrimRequest) returns (CreateOrderResponse);
  // ResolveHeldOrder closes out a transaction whose payment did not match the
  // bill. Without it a held transaction is a dead end needing database access.
  rpc ResolveHeldOrder(ResolveHeldOrderRequest) returns (Order);
}

message Order {
  string id = 1;
  string operator_id = 2;
  string season_id = 3;
  string pilgrim_id = 4;
  string pilgrim_name = 5;
  string product_id = 6;
  string product_name = 7;
  string agent_id = 8;
  string agent_name = 9;
  int32 quantity = 10;
  int64 unit_price_idr = 11;
  int64 total_price_idr = 12;
  int64 platform_amount_idr = 13;
  int64 operator_amount_idr = 14;
  int64 agent_commission_idr = 15;
  // PENDING | PAID | EXPIRED | FAILED | CANCELLED | REFUNDED
  string status = 16;
  string checkout_url = 17;
  google.protobuf.Timestamp paid_at = 18;
  google.protobuf.Timestamp created_at = 19;
  // Who placed the order, when it was not the jamaah themselves. Distinct from
  // agent_id, which is the referrer who earns the commission.
  string placed_by_agent_id = 20;
  // What the gateway reported as actually paid, and why the transaction is
  // held if it is. Both empty until a payment notification arrives.
  int64 paid_amount_idr = 22;
  string held_reason = 23;
  string receipt_number = 24;
}

message CreateOrderRequest {
  string app_access_code = 1 [(buf.validate.field).string.min_len = 1];
  string product_id = 2 [(buf.validate.field).string.min_len = 1];
  int32 quantity = 3 [(buf.validate.field).int32 = {gte: 1, lte: 20}];
  // Required: without it a double-tapped checkout button made two orders and
  // two invoices, and the jamaah could pay both. The same key always settles
  // the same order and returns its existing payment link.
  string idempotency_key = 4 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message CreateOrderResponse {
  Order order = 1;
  // Xendit's hosted invoice page — the frontend redirects here to
  // complete payment. Empty if Xendit isn't configured (XENDIT_SECRET_KEY
  // unset), or if the order was created already-PAID (CreateManualOrder
  // with a CASH/BANK_TRANSFER method); see internal/payment/xendit.go.
  string checkout_url = 2;
}

enum ManualOrderPaymentMethod {
  MANUAL_ORDER_PAYMENT_METHOD_UNSPECIFIED = 0;
  // Generates a Xendit invoice link the operator shares with the pilgrim
  // (WhatsApp, etc.) — order stays PENDING until the webhook confirms it,
  // exactly like the pilgrim's own self-checkout.
  MANUAL_ORDER_PAYMENT_METHOD_XENDIT_LINK = 1;
  // Operator attests payment was already received outside Xendit — the
  // order is created already PAID. Always audit-logged (see
  // OrderService.CreateManualOrder); there is no gateway confirmation
  // backing these two, so the log is the only accountability trail.
  MANUAL_ORDER_PAYMENT_METHOD_CASH = 2;
  MANUAL_ORDER_PAYMENT_METHOD_BANK_TRANSFER = 3;
}

message CreateManualOrderRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
  string product_id = 2 [(buf.validate.field).string.uuid = true];
  int32 quantity = 3 [(buf.validate.field).int32 = {gte: 1, lte: 20}];
  ManualOrderPaymentMethod payment_method = 4 [(buf.validate.field).enum = {defined_only: true, in: [1, 2, 3]}];
  string note = 5 [(buf.validate.field).string.max_len = 500];
  string idempotency_key = 6 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message CreateOrderForPilgrimRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
  string product_id = 2 [(buf.validate.field).string.uuid = true];
  int32 quantity = 3 [(buf.validate.field).int32 = {gte: 1, lte: 20}];
  string idempotency_key = 4 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

enum HeldOrderResolution {
  HELD_ORDER_RESOLUTION_UNSPECIFIED = 0;
  // The operator attests the difference was settled another way — cash handed
  // over at the counter, a top-up transfer, or a shortfall they chose to
  // waive. The transaction stands in full, so the commission stands too.
  // There is no gateway confirmation behind this, which is why it is always
  // audit-logged with who decided it and the discrepancy they accepted.
  HELD_ORDER_RESOLUTION_ACCEPT = 1;
  // The transaction is abandoned and the money returned outside the system.
  // Commission recognised when the order was placed is reversed.
  HELD_ORDER_RESOLUTION_REJECT = 2;
}

message ResolveHeldOrderRequest {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
  HeldOrderResolution resolution = 2 [(buf.validate.field).enum = {defined_only: true, in: [1, 2]}];
  string note = 3 [(buf.validate.field).string.max_len = 500];
}

message ListOrdersRequest {
  string season_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 limit = 2;
  int32 offset = 3;
}
message ListOrdersResponse {
  repeated Order orders = 1;
  int64 total_count = 2;
}

message OrderRefund {
  string id = 1;
  string order_id = 2;
  // Always the order's full total; a refund is never partial.
  int64 amount_idr = 3;
  // How much agent commission this refund clawed back — commission is earned
  // only on sales that stand, so this is the whole commission.
  int64 commission_reversed_idr = 4;
  string reason = 5;
  string created_by_user_id = 6;
  google.protobuf.Timestamp created_at = 7;
}

message RefundOrderRequest {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
  // No amount. A refund always returns the whole transaction, so a partial one
  // is not something this request can express — the rule is enforced by the
  // shape of the message rather than by a check someone could route around.
  reserved 2;
  reserved "amount_idr";
  string reason = 3 [(buf.validate.field).string.max_len = 500];
  // Required, not optional: a refund is money leaving, and a retried or
  // double-clicked request must settle the same refund rather than issue a
  // second one. The same key always refers to the same refund.
  string idempotency_key = 4 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message RefundOrderResponse {
  Order order = 1;
  OrderRefund refund = 2;
  // The pilgrim's balance after this refund, so the caller does not have to
  // ask separately for the number it just changed.
  int64 pilgrim_balance_idr = 3;
  // False when this request was a replay and the refund already existed.
  bool created = 4;
}

message ListOrderRefundsRequest { string order_id = 1 [(buf.validate.field).string.uuid = true]; }
message ListOrderRefundsResponse {
  // At most one, since an order can only be refunded once and only in full.
  repeated OrderRefund refunds = 1;
  int64 total_refunded_idr = 2;
}

message GetOrderRequest { string order_id = 1 [(buf.validate.field).string.min_len = 1]; }
