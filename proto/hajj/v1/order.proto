syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

// Module 7: Digital Products & Orders. CreateOrder is public — a pilgrim
// checks out from their own PWA, authenticated by app_access_code the same
// way as every other PilgrimAppService call, not a Better Auth session (see
// publicProcedures in internal/middleware/auth.go). ListOrders/GetOrder are
// the normal authenticated/org-scoped lane, for the admin dashboard.
service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetOrder(GetOrderRequest) returns (Order);
}

message Order {
  string id = 1;
  string operator_id = 2;
  string season_id = 3;
  string pilgrim_id = 4;
  string pilgrim_name = 5;
  string product_id = 6;
  string product_name = 7;
  string agent_id = 8;
  string agent_name = 9;
  int32 quantity = 10;
  int64 unit_price_idr = 11;
  int64 total_price_idr = 12;
  int64 platform_amount_idr = 13;
  int64 operator_amount_idr = 14;
  int64 agent_commission_idr = 15;
  // PENDING | PAID | EXPIRED | FAILED | CANCELLED
  string status = 16;
  string checkout_url = 17;
  google.protobuf.Timestamp paid_at = 18;
  google.protobuf.Timestamp created_at = 19;
}

message CreateOrderRequest {
  string app_access_code = 1 [(buf.validate.field).string.min_len = 1];
  string product_id = 2 [(buf.validate.field).string.min_len = 1];
  int32 quantity = 3 [(buf.validate.field).int32 = {gte: 1, lte: 20}];
}

message CreateOrderResponse {
  Order order = 1;
  // Xendit's hosted invoice page — the frontend redirects here to
  // complete payment. Empty if Xendit isn't configured (XENDIT_SECRET_KEY
  // unset); see internal/payment/xendit.go.
  string checkout_url = 2;
}

message ListOrdersRequest {
  string season_id = 1 [(buf.validate.field).string.min_len = 1];
}
message ListOrdersResponse { repeated Order orders = 1; }

message GetOrderRequest { string order_id = 1 [(buf.validate.field).string.min_len = 1]; }
