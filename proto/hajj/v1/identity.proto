syntax = "proto3";

package hajj.v1;

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

// IdentityService is the single entry point every surface (operator
// dashboard, group leader app, pilgrim app) signs in through on one shared
// domain. GetMyAccess answers "who is this Better Auth identity, across
// every role system in this app" so the frontend can land the caller on the
// right place without hardcoding which surface they came from. Runs through
// the session-only (not org-scoped) auth lane — see sessionOnlyProcedures in
// internal/middleware/auth.go — because a pure leader or pilgrim identity is
// never an organization member.
service IdentityService {
  rpc GetMyAccess(GetMyAccessRequest) returns (MyAccess);
  // InvalidateMyAccess drops the caller's cached MyAccess (see the TTL
  // cache in internal/repository/identity.go) immediately. For role
  // changes the Go API has no visibility into on its own — e.g. accepting
  // a Better Auth organization invitation happens entirely in Next.js
  // (lib/auth.ts), so nothing here would otherwise know to invalidate
  // before the cache's TTL naturally expires.
  rpc InvalidateMyAccess(InvalidateMyAccessRequest) returns (InvalidateMyAccessResponse);
}

message GetMyAccessRequest {}

message InvalidateMyAccessRequest {}
message InvalidateMyAccessResponse {}

message MyAccess {
  // Operator staff — a Better Auth organization member. org_role is
  // Better Auth's own organization-plugin role: "owner" | "admin" |
  // "member" (owner: full control incl. billing/staff management; admin:
  // full operational control; member: operational access, no staff/billing
  // management). Not yet enforced per-RPC beyond org membership itself —
  // routing only for now.
  bool is_org_member = 1;
  string org_role = 2;
  string operator_id = 3;
  string operator_name = 4;
  // Used to build the operator's own subdomain link (e.g.
  // vacana.tawafiqhub.id) — see apps/web/lib/tenant-link.ts. Empty if the
  // operator was created before slugs existed and never got backfilled one.
  string operator_slug = 8;

  // Group Leader — every group this identity leads (groups.leader_id).
  // Usually one, but a person can lead more than one group.
  repeated LeaderGroupSummary leader_groups = 5;

  // Pilgrim — set only if this identity has linked a pilgrim record via
  // PilgrimAppService.LinkGoogleAccount. A Better Auth identity can be
  // linked to at most one pilgrim (pilgrims.linked_user_id is unique).
  PilgrimSummary linked_pilgrim = 6;

  // Tour Leader (Agent) — set when this Better Auth identity is linked to
  // an active agent record via agents.linked_user_id within this org's
  // operator. A user can be simultaneously an org member AND a linked
  // agent (Tour Leaders are invited as org members, and every Group
  // Leader is auto-created as one too — see EnsureAgentForLeader).
  AgentSummary linked_agent = 7;
}

message AgentSummary {
  string id = 1;
  string name = 2;
  string referral_code = 3;
  bool is_active = 4;
  string phone = 5;
}

message LeaderGroupSummary {
  string id = 1;
  string name = 2;
}

message PilgrimSummary {
  string id = 1;
  string app_access_code = 2;
  string full_name = 3;
}
