syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

service ChecklistService {
  // Template management (operator)
  rpc CreateChecklistTemplate(CreateChecklistTemplateRequest) returns (ChecklistTemplate);
  rpc ListChecklistTemplates(ListChecklistTemplatesRequest) returns (ListChecklistTemplatesResponse);
  rpc DeleteChecklistTemplate(DeleteChecklistTemplateRequest) returns (DeleteChecklistTemplateResponse);

  // Per-pilgrim checklist (operator side)
  rpc GetPilgrimChecklist(GetPilgrimChecklistRequest) returns (GetPilgrimChecklistResponse);
  rpc UpdateChecklistItem(UpdateChecklistItemRequest) returns (ChecklistItem);
  rpc GetChecklistStats(GetChecklistStatsRequest) returns (GetChecklistStatsResponse);

  // Pilgrim-app facing — public, authenticated by app_access_code.
  rpc GetMyChecklist(GetMyChecklistRequest) returns (GetMyChecklistResponse);
  rpc CompleteMyChecklistItem(CompleteMyChecklistItemRequest) returns (ChecklistItem);
}

message ChecklistTemplate {
  string id = 1;
  string title = 2;
  string description = 3;
  string category = 4;
  bool is_required = 5;
  int32 sort_order = 6;
}

message ChecklistItem {
  string template_id = 1;
  string title = 2;
  string description = 3;
  string category = 4;
  bool is_required = 5;
  bool is_completed = 6;
  string completed_by = 7;
  string notes = 8;
  google.protobuf.Timestamp completed_at = 9;
}

message ChecklistStat {
  string template_id = 1;
  string title = 2;
  string category = 3;
  bool is_required = 4;
  int32 completed_count = 5;
  int32 total_pilgrims = 6;
}

message CreateChecklistTemplateRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
  string title = 2 [(buf.validate.field).string.min_len = 1];
  string description = 3;
  string category = 4;
  bool is_required = 5;
  int32 sort_order = 6;
}
message ListChecklistTemplatesRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
}
message ListChecklistTemplatesResponse {
  repeated ChecklistTemplate templates = 1;
}
message DeleteChecklistTemplateRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteChecklistTemplateResponse {}
message GetPilgrimChecklistRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
  string season_id = 2 [(buf.validate.field).string.uuid = true];
}
message GetPilgrimChecklistResponse {
  repeated ChecklistItem items = 1;
}
message UpdateChecklistItemRequest {
  string template_id = 1 [(buf.validate.field).string.uuid = true];
  string pilgrim_id = 2 [(buf.validate.field).string.uuid = true];
  bool is_completed = 3;
  string notes = 4;
}
message GetChecklistStatsRequest {
  string season_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetChecklistStatsResponse {
  repeated ChecklistStat stats = 1;
}
message GetMyChecklistRequest {
  string app_access_code = 1 [(buf.validate.field).string.min_len = 1];
}
message GetMyChecklistResponse {
  repeated ChecklistItem items = 1;
}
message CompleteMyChecklistItemRequest {
  string app_access_code = 1 [(buf.validate.field).string.min_len = 1];
  string template_id = 2 [(buf.validate.field).string.uuid = true];
  bool is_completed = 3;
  string notes = 4;
}
