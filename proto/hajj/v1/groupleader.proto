syntax = "proto3";

package hajj.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "hajj/v1/pilgrim.proto";
import "hajj/v1/sos.proto";

option go_package = "github.com/hajj-saas/api/internal/gen/hajj/v1;hajjv1";

// GroupLeaderService is fully authenticated and self-scoped — every method
// filters by groups.leader_id = the caller's Better Auth user id, resolved
// server-side, never taken from the request.
service GroupLeaderService {
  rpc ListMyGroups(ListMyGroupsRequest) returns (ListMyGroupsResponse);
  rpc GetGroupRoster(GetGroupRosterRequest) returns (GetGroupRosterResponse);
  rpc ListCheckIns(ListCheckInsRequest) returns (ListCheckInsResponse);
  rpc CreateCheckIn(CreateCheckInRequest) returns (CheckIn);
  // ListMySOSAlerts returns active/escalated SOS alerts for pilgrims in
  // groups this leader leads — a narrower view than the coordinator
  // dashboard's operator-wide SOSService.ListActiveSOSAlerts.
  rpc ListMySOSAlerts(ListMySOSAlertsRequest) returns (ListSOSAlertsResponse);
  // CheckInGroupPilgrimHotel is the leader-scoped counterpart to
  // PilgrimService.CheckInPilgrimHotel (dashboard/operator-wide) — verifies
  // the pilgrim is in a group this leader leads before touching anything.
  rpc CheckInGroupPilgrimHotel(CheckInGroupPilgrimHotelRequest) returns (Pilgrim);
  // AcknowledgeMySOSAlert/ResolveMySOSAlert are the leader-scoped
  // counterparts to SOSService's operator-wide equivalents — only an alert
  // already visible via ListMySOSAlerts (i.e. for one of this leader's own
  // pilgrims) can be acted on.
  rpc AcknowledgeMySOSAlert(AcknowledgeMySOSAlertRequest) returns (SOSAlert);
  rpc ResolveMySOSAlert(ResolveMySOSAlertRequest) returns (SOSAlert);
  // UpdateMyGroupCity is the Muttawwif's Tab Lokasi one-tap action —
  // cascades to every pilgrim's journey status (best-effort).
  rpc UpdateMyGroupCity(UpdateMyGroupCityRequest) returns (LeaderGroup);
}

message LeaderGroup {
  string id = 1;
  string name = 2;
  int32 capacity = 3;
  int32 pilgrim_count = 4;
  string season_id = 5;
  string current_city = 6; // INDONESIA | MADINAH | MAKKAH | ARAFAH | MUZDALIFAH | MINA | TRANSIT | DEPARTED
  google.protobuf.Timestamp last_update = 7;
  string current_activity = 8;
}

message UpdateMyGroupCityRequest {
  string group_id = 1 [(buf.validate.field).string.min_len = 1];
  string city = 2 [(buf.validate.field).string.min_len = 1];
  string location = 3;
  string notes = 4;
  string activity = 5;
}

message ListMyGroupsRequest {}
message ListMyGroupsResponse { repeated LeaderGroup groups = 1; }

message GetGroupRosterRequest {
  string group_id = 1 [(buf.validate.field).string.min_len = 1];
}
message GetGroupRosterResponse { repeated Pilgrim pilgrims = 1; }

message CheckIn {
  string id = 1;
  string movement_id = 2;
  string pilgrim_id = 3;
  string type = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListCheckInsRequest {
  string movement_id = 1 [(buf.validate.field).string.min_len = 1];
}
message ListCheckInsResponse { repeated CheckIn check_ins = 1; }

message CreateCheckInRequest {
  string movement_id = 1 [(buf.validate.field).string.min_len = 1];
  string pilgrim_id = 2 [(buf.validate.field).string.min_len = 1];
  string type = 3 [(buf.validate.field).string = {in: ["DEPARTURE", "ARRIVAL"]}];
}

message ListMySOSAlertsRequest {}

message CheckInGroupPilgrimHotelRequest {
  string pilgrim_id = 1 [(buf.validate.field).string.uuid = true];
  bool checked_in = 2;
}

message AcknowledgeMySOSAlertRequest {
  string sos_alert_id = 1 [(buf.validate.field).string.uuid = true];
}

message ResolveMySOSAlertRequest {
  string sos_alert_id = 1 [(buf.validate.field).string.uuid = true];
  string notes = 2;
}
