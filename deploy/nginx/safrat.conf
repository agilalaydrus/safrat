# Managed by .github/workflows/deploy.yml. Do not edit only on the VPS;
# commit changes here so nginx configuration remains reproducible.

# Go API keeps its dedicated origin.
server {
    listen 80;
    server_name api.tawafiqhub.id;
    return 301 https://api.tawafiqhub.id$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.tawafiqhub.id;

    ssl_certificate     /etc/letsencrypt/live/app.tawafiqhub.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.tawafiqhub.id/privkey.pem;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The payment webhook is the one path on this host that a third party is
    # expected to call, so it is the one worth narrowing. Deliveries are
    # accepted only from the gateway's published egress ranges; everything else
    # is refused at the edge, before the request reaches the API at all.
    #
    # This is the outermost of three independent controls. The API additionally
    # checks the callback token, and — the one that actually protects the money
    # — settles from Xendit's own API rather than from whatever the delivery
    # claims. So a stale entry here costs a delivery, not a payment: the poller
    # settles it within a couple of minutes regardless.
    #
    # Keep in step with XENDIT_WEBHOOK_ALLOWED_IPS in .env.prod, and with
    # Xendit's published list, which does change.
    #
    # The allow/deny lines are commented out on purpose. Xendit's egress
    # ranges have to be read from their dashboard at the time of the cutover —
    # they are not something to guess at, and a wrong list here blocks every
    # payment notification at the edge, where the application-level guard
    # cannot soften it. Paste the published ranges, uncomment, then
    # `nginx -t` before reloading.
    location = /webhooks/xendit {
        # allow <xendit-range-1>;
        # allow <xendit-range-2>;
        # deny  all;

        proxy_pass         http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Preserve old bookmarks while making the apex domain canonical.
server {
    listen 80;
    server_name tawafiqhub.id www.tawafiqhub.id app.tawafiqhub.id;
    return 301 https://tawafiqhub.id$request_uri;
}

# Every operator uses one first-level tenant hostname. Exact server names win
# over this wildcard, so api/app/www and future dedicated platform services do
# not accidentally enter the tenant application.
server {
    listen 80;
    server_name *.tawafiqhub.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.tawafiqhub.id;

    ssl_certificate     /etc/letsencrypt/live/app.tawafiqhub.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.tawafiqhub.id/privkey.pem;

    return 301 https://tawafiqhub.id$request_uri;
}

# Canonical Next.js application, including the www alias covered by the same
# certificate. www redirects before any application response is served.
server {
    listen 443 ssl;
    http2 on;
    server_name www.tawafiqhub.id;

    ssl_certificate     /etc/letsencrypt/live/tawafiqhub.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tawafiqhub.id/privkey.pem;

    return 301 https://tawafiqhub.id$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tawafiqhub.id;

    ssl_certificate     /etc/letsencrypt/live/tawafiqhub.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tawafiqhub.id/privkey.pem;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # These routes contain bearer-equivalent identifiers in the path.
    location ~ ^/(pilgrim|leader)/ {
        access_log off;
        proxy_pass         http://127.0.0.1:9101;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /sw.js {
        proxy_pass http://127.0.0.1:9101;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass         http://127.0.0.1:9101;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# Public storefront media and presigned browser uploads. The MinIO console is
# disabled and port 9001 is never published; only its S3 API is reachable.
server {
    listen 443 ssl;
    http2 on;
    server_name assets.tawafiqhub.id;

    ssl_certificate     /etc/safrat/lego/certificates/tawafiqhub.id.crt;
    ssl_certificate_key /etc/safrat/lego/certificates/tawafiqhub.id.key;

    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /safrat-uploads/storefront/ {
        proxy_pass              http://127.0.0.1:9102;
        proxy_http_version      1.1;
        proxy_set_header        Host $http_host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering         off;
        add_header              Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass              http://127.0.0.1:9102;
        proxy_http_version      1.1;
        proxy_set_header        Host $http_host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering         off;
    }
}

# Reserved platform names are blocked until a dedicated service is explicitly
# configured. This list mirrors the API and database slug policy; app/api/www
# already have their own exact server blocks above.
server {
    listen 443 ssl;
    http2 on;
    server_name admin.tawafiqhub.id auth.tawafiqhub.id cdn.tawafiqhub.id
                dashboard.tawafiqhub.id docs.tawafiqhub.id help.tawafiqhub.id
                media.tawafiqhub.id status.tawafiqhub.id storage.tawafiqhub.id
                support.tawafiqhub.id;

    ssl_certificate     /etc/safrat/lego/certificates/tawafiqhub.id.crt;
    ssl_certificate_key /etc/safrat/lego/certificates/tawafiqhub.id.key;

    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 404;
}

# Operator storefronts and public registration paths. The Host header must be
# preserved because apps/web/middleware.ts extracts the operator slug from it.
server {
    listen 443 ssl;
    http2 on;
    server_name *.tawafiqhub.id;

    ssl_certificate     /etc/safrat/lego/certificates/tawafiqhub.id.crt;
    ssl_certificate_key /etc/safrat/lego/certificates/tawafiqhub.id.key;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ ^/(pilgrim|leader)/ {
        access_log off;
        proxy_pass         http://127.0.0.1:9101;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /sw.js {
        proxy_pass http://127.0.0.1:9101;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass         http://127.0.0.1:9101;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
