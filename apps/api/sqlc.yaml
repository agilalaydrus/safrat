version: "2"
sql:
  - engine: "postgresql"
    queries: "db/query/"
    schema:
      - "db/migrations/"
      - "db/schema_stubs/"
    gen:
      go:
        package: "db"
        out: "internal/gen/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
