name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Buf lint
        run: buf lint proto/
        # buf breaking against main is intentionally not run here yet — it
        # currently fails to resolve proto/buf.lock dependencies against the
        # main branch's historical state, unrelated to any real breaking
        # change. Fix that resolution before adding a breaking-change gate.

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: Install sqlc
        run: |
          curl -fsSL https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz | tar -xz
          sudo mv sqlc /usr/local/bin/

      - name: Generate proto + sqlc
        run: |
          (cd proto && buf generate)
          (cd apps/api && sqlc generate)

      - name: Go build and vet
        run: cd apps/api && go build ./... && go vet ./...

      - name: Go test
        run: cd apps/api && go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm typecheck
