name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip build, only deploy (y/n)'
        default: 'n'
      override_api_url:
        description: 'Override NEXT_PUBLIC_API_URL (leave blank for https://api.tawafiqhub.id)'
        default: ''
      override_app_url:
        description: 'Override NEXT_PUBLIC_APP_URL (leave blank for https://tawafiqhub.id)'
        default: ''

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/safrat-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/safrat-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install Buf CLI
        uses: bufbuild/buf-setup-action@v1

      - name: Install sqlc
        run: |
          curl -fsSL https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz | tar -xz
          sudo mv sqlc /usr/local/bin/

      - name: Generate proto + sqlc
        run: |
          (cd proto && buf generate)
          (cd apps/api && sqlc generate)

      - name: Go test
        run: cd apps/api && go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm --filter @hajj-saas/web typecheck

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        if: ${{ github.event.inputs.skip_build != 'y' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push Web image
        if: ${{ github.event.inputs.skip_build != 'y' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          build-args: |
            APP_BUILD_REVISION=${{ github.sha }}
            NEXT_PUBLIC_API_URL=${{ github.event.inputs.override_api_url != '' && github.event.inputs.override_api_url || 'https://api.tawafiqhub.id' }}
            NEXT_PUBLIC_APP_URL=${{ github.event.inputs.override_app_url != '' && github.event.inputs.override_app_url || 'https://tawafiqhub.id' }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
            export IMAGE_TAG=${{ github.event.inputs.skip_build == 'y' && 'latest' || github.sha }}
            cd /home/deploy/safrat

            # Prune old images first — runs even if the previous deploy
            # attempt failed partway through, before this one pulls more.
            docker image prune -f

            # Pull latest repo (migration files live in repo)
            git pull origin main

            # Pull new images
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull

            set -a
            source .env.prod
            set +a

            # Storefront media is a production feature, not an optional
            # best-effort dependency. Fail before migrations/restarts when a
            # bucket secret or public origin is missing from the VPS.
            for required_name in \
              MINIO_ROOT_USER MINIO_ROOT_PASSWORD \
              S3_ENDPOINT S3_REGION S3_BUCKET S3_ACCESS_KEY_ID \
              S3_SECRET_ACCESS_KEY S3_PUBLIC_BASE_URL S3_FORCE_PATH_STYLE; do
              if [ -z "${!required_name:-}" ]; then
                echo "missing required production variable: ${required_name}" >&2
                exit 1
              fi
            done
            # App database credentials are an all-or-nothing cutover. A
            # half-configured pair would restart every app service with a
            # username/password mismatch while migrations still succeeded.
            if { [ -n "${APP_PGUSER:-}" ] && [ -z "${APP_PGPASSWORD:-}" ]; } || \
               { [ -z "${APP_PGUSER:-}" ] && [ -n "${APP_PGPASSWORD:-}" ]; }; then
              echo "APP_PGUSER and APP_PGPASSWORD must be set together" >&2
              exit 1
            fi
            # The canonical deployment value deliberately overrides any stale
            # app-subdomain value that may still exist in .env.prod.
            export CORS_ALLOWED_ORIGIN=https://tawafiqhub.id

            # Start stateful dependencies and reconcile MinIO before any API
            # can issue upload tickets. minio-init is safe to run every deploy.
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              up -d postgres redis minio
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              up --no-deps minio-init
            sleep 5

            NETWORK=$(docker network ls --filter name=safrat_internal --format '{{.Name}}' | head -1)

            # Better Auth owns its own tables (user/session/account/etc.) and
            # migrates them itself — goose's 025_fix_groups_leader_id.sql and
            # later reference "user", so this must run before goose.
            docker run --rm \
              --network "${NETWORK:-safrat_internal}" \
              -v "$(pwd):/repo" \
              -w /repo \
              -e PGHOST=postgres \
              -e PGPORT=5432 \
              -e PGUSER=safrat \
              -e PGPASSWORD="${POSTGRES_PASSWORD}" \
              -e PGDATABASE=safrat \
              -e BETTER_AUTH_SECRET="${BETTER_AUTH_SECRET}" \
              -e BETTER_AUTH_URL="https://tawafiqhub.id" \
              -e NEXT_PUBLIC_APP_URL="https://tawafiqhub.id" \
              node:20-alpine \
              sh -c 'apk add --no-cache python3 make g++ && corepack enable && corepack prepare pnpm@9 --activate && pnpm install --frozen-lockfile --config.node-linker=hoisted && cd apps/web && npx auth@1.6.28 migrate --yes'

            # Run goose migrations before restarting API
            docker run --rm \
              --network "${NETWORK:-safrat_internal}" \
              -v "$(pwd)/apps/api/db/migrations:/migrations" \
              -e GOOSE_DRIVER=postgres \
              -e GOOSE_DBSTRING="host=postgres port=5432 user=safrat dbname=safrat sslmode=disable" \
              -e GOOSE_MIGRATION_DIR=/migrations \
              -e PGPASSWORD="${POSTGRES_PASSWORD}" \
              ghcr.io/kukymbr/goose-docker:latest \
              up

            # Root-owned, least-privilege helper installed once during VPS
            # bootstrap. It hardcodes the source/target, validates nginx, and
            # restores the previous config before returning any failure.
            sudo -n /usr/local/sbin/safrat-install-nginx

            # Rolling restart — API first (no downtime for pure API changes),
            # web second. Worker restarts together with API (same image).
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              up -d --no-deps api worker
            sleep 5
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              up -d --no-deps web

            # A green SSH step must also mean the public routing is correct.
            # Retry readiness because the new containers may still be warming.
            wait_for_status() {
              url="$1"
              expected="$2"
              attempts=0

              while [ "${attempts}" -lt 15 ]; do
                actual=$(curl --silent --show-error \
                  --connect-timeout 5 --max-time 15 \
                  --output /dev/null --write-out '%{http_code}' \
                  "${url}" || true)
                if [ "${actual}" = "${expected}" ]; then
                  return 0
                fi
                attempts=$((attempts + 1))
                sleep 2
              done

              echo "unexpected status for ${url}: expected ${expected}, got ${actual}" >&2
              return 1
            }

            expect_redirect() {
              url="$1"
              expected="$2"
              actual=$(curl --silent --show-error \
                --connect-timeout 5 --max-time 15 \
                --output /dev/null --write-out '%{http_code} %{redirect_url}' \
                "${url}")

              if [ "${actual}" != "301 ${expected}" ]; then
                echo "unexpected redirect for ${url}: ${actual}" >&2
                return 1
              fi
            }

            wait_for_status "https://api.tawafiqhub.id/readyz" "200"
            wait_for_status "https://tawafiqhub.id/" "200"
            wait_for_status "https://tawafiqhub.id/sw.js" "200"
            wait_for_status "https://assets.tawafiqhub.id/minio/health/live" "200"
            # Unknown tenants must reach the wildcard TLS/web route and then
            # produce the application's real 404. Reserved names are rejected
            # directly by nginx rather than entering the tenant middleware.
            wait_for_status "https://tenant-probe.tawafiqhub.id/" "404"
            wait_for_status "https://admin.tawafiqhub.id/" "404"
            expect_redirect \
              "https://app.tawafiqhub.id/deploy-probe?source=app" \
              "https://tawafiqhub.id/deploy-probe?source=app"
            expect_redirect \
              "https://www.tawafiqhub.id/deploy-probe?source=www" \
              "https://tawafiqhub.id/deploy-probe?source=www"
            expect_redirect \
              "http://tawafiqhub.id/deploy-probe?source=http" \
              "https://tawafiqhub.id/deploy-probe?source=http"
            expect_redirect \
              "http://tenant-probe.tawafiqhub.id/deploy-probe?source=tenant" \
              "https://tenant-probe.tawafiqhub.id/deploy-probe?source=tenant"

            cors_origin=$(curl --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              --dump-header - --output /dev/null \
              --header "Origin: https://tawafiqhub.id" \
              "https://api.tawafiqhub.id/healthz" \
              | tr -d '\r' \
              | awk -F ': ' 'tolower($1) == "access-control-allow-origin" {print $2; exit}')
            if [ "${cors_origin}" != "https://tawafiqhub.id" ]; then
              echo "unexpected CORS origin: ${cors_origin}" >&2
              exit 1
            fi

            tenant_cors_origin=$(curl --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              --dump-header - --output /dev/null \
              --header "Origin: https://tenant-probe.tawafiqhub.id" \
              "https://api.tawafiqhub.id/healthz" \
              | tr -d '\r' \
              | awk -F ': ' 'tolower($1) == "access-control-allow-origin" {print $2; exit}')
            if [ "${tenant_cors_origin}" != "https://tenant-probe.tawafiqhub.id" ]; then
              echo "unexpected tenant CORS origin: ${tenant_cors_origin}" >&2
              exit 1
            fi

            asset_cors_response=$(curl --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              --request OPTIONS \
              --dump-header - --output /dev/null \
              --write-out $'\n%{http_code}' \
              --header "Origin: https://tawafiqhub.id" \
              --header "Access-Control-Request-Method: PUT" \
              --header "Access-Control-Request-Headers: Content-Type" \
              "https://assets.tawafiqhub.id/${S3_BUCKET}/storefront-pending/deploy-probe.webp" \
              | tr -d '\r')
            asset_cors_status=$(printf '%s\n' "${asset_cors_response}" | tail -1)
            asset_cors_origin=$(printf '%s\n' "${asset_cors_response}" \
              | awk -F ': ' 'tolower($1) == "access-control-allow-origin" {print $2; exit}')
            if { [ "${asset_cors_status}" != "200" ] && [ "${asset_cors_status}" != "204" ]; } \
              || [ "${asset_cors_origin}" != "https://tawafiqhub.id" ]; then
              echo "unexpected asset CORS response: status=${asset_cors_status} origin=${asset_cors_origin}" >&2
              exit 1
            fi

            # A missing published key must be anonymously readable far enough
            # to return NoSuchKey, not the AccessDenied response of a private
            # bucket. No probe object is left behind.
            asset_probe=$(curl --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              "https://assets.tawafiqhub.id/${S3_BUCKET}/storefront/.deploy-probe" || true)
            case "${asset_probe}" in
              *"<Code>NoSuchKey</Code>"*) ;;
              *)
                echo "published asset prefix is not anonymously readable" >&2
                exit 1
                ;;
            esac
