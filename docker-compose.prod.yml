services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: safrat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: safrat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports exposed — internal network only
    networks:
      - internal

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --address ":9000" --console-address ":9001"
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # The admin console stays disabled and unpublished in production. All
      # bucket administration runs through the one-shot minio-init service.
      MINIO_BROWSER: "off"
      MINIO_API_CORS_ALLOW_ORIGIN: https://tawafiqhub.id
    ports:
      - "127.0.0.1:9102:9000" # nginx assets host -> MinIO S3 API
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  # Idempotently creates the bucket, a least-privilege API user, public-read
  # access only for published storefront objects, and the abandoned-upload
  # lifecycle. Browser CORS is enforced by minio above. It exits after
  # reconciliation.
  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./deploy/minio:/config:ro
    entrypoint: ["/bin/sh", "/config/bootstrap"]
    networks:
      - internal

  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/safrat-api:${IMAGE_TAG:-latest}
    restart: always
    environment:
      # No DATABASE_URL — pgxpool.New(ctx, "") in main.go resolves these
      # directly, avoiding URL parsing entirely (a raw password embedded in
      # a URL broke this in production: pgx silently produced an empty
      # host and fell back to a unix socket instead of erroring).
      PGHOST: postgres
      PGPORT: "5432"
      # Defaults preserve the current owner connection. Set APP_PGUSER and
      # APP_PGPASSWORD only when cutting application services over to the
      # least-privilege role; migration jobs keep their separate owner login.
      PGUSER: ${APP_PGUSER:-safrat}
      PGPASSWORD: ${APP_PGPASSWORD:-${POSTGRES_PASSWORD}}
      PGDATABASE: safrat
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-https://tawafiqhub.id}
      SENTRY_DSN: ${SENTRY_DSN}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN}
      XENDIT_WEBHOOK_ALLOWED_IPS: ${XENDIT_WEBHOOK_ALLOWED_IPS}
      KYC_ENCRYPTION_KEY: ${KYC_ENCRYPTION_KEY}
      UPLOAD_DIR: /uploads/documents
      # Direct browser upload to the self-hosted MinIO endpoint. Credentials
      # belong to a bucket-scoped service user and are consumed by API only.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      STOREFRONT_STORAGE_QUOTA_MB: ${STOREFRONT_STORAGE_QUOTA_MB:-250}
      # Shared monitoring event bus, operator cache invalidation, and public
      # endpoint rate limiter. Required for consistent multi-replica behavior.
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:9100:8080"   # nginx -> localhost:9100 -> container :8080
    volumes:
      # KYC documents and payout proofs must survive image replacement.
      - uploads_data:/uploads
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    extra_hosts:
      # Server-side HEAD/GET/COPY requests use the same externally signed host
      # as browser PUTs, but stay on the VPS rather than hairpinning externally.
      - "assets.tawafiqhub.id:host-gateway"
    networks:
      - internal

  # Same image as api, different command — see apps/api/Dockerfile (CMD is
  # overridden here to run the /worker binary instead of /server). Without
  # this service, SOS alerts never escalate past ACTIVE to a coordinator.
  worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/safrat-api:${IMAGE_TAG:-latest}
    command: ["/worker"]
    restart: always
    environment:
      KYC_ENCRYPTION_KEY: ${KYC_ENCRYPTION_KEY}
      # Payment reconciliation and automatic refund payouts run here.
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${APP_PGUSER:-safrat}
      PGPASSWORD: ${APP_PGPASSWORD:-${POSTGRES_PASSWORD}}
      PGDATABASE: safrat
      REDIS_URL: redis://redis:6379
      SENTRY_DSN: ${SENTRY_DSN}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    depends_on:
      - postgres
      - redis
      - minio-init
    extra_hosts:
      - "assets.tawafiqhub.id:host-gateway"
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: always
    # No ports exposed — internal network only, same as postgres
    networks:
      - internal

  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/safrat-web:${IMAGE_TAG:-latest}
    restart: always
    environment:
      # apps/web/lib/auth.ts's Pool() reads these directly (no DATABASE_URL
      # string) — a raw password embedded in a URL breaks Node's strict URL
      # parser if it contains certain characters (this broke in production).
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${APP_PGUSER:-safrat}
      PGPASSWORD: ${APP_PGPASSWORD:-${POSTGRES_PASSWORD}}
      PGDATABASE: safrat
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://tawafiqhub.id
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-${SMTP_USER}}
      SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - "127.0.0.1:9101:3000"   # nginx -> localhost:9101 -> container :3000
    depends_on:
      - postgres
    networks:
      - internal

volumes:
  postgres_data:
  minio_data:
  uploads_data:

networks:
  internal:
    driver: bridge
